name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Both, because the tool shells out to platform tools (pgrep, lsof) and the
    # difference between macOS and Linux is exactly where that bites.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - run: make lint
      - run: make test
      - run: make build

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      # A release ships four binaries; a build break on any of them is a release
      # break, so find it here rather than at tag time.
      - run: make dist
