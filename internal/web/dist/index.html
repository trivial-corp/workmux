<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>workmux</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  :root { color-scheme: dark; --bg:#0e0e13; --panel:#15151c; --elev:#1a1a22; --ink:#e7e7ee;
          --dim:#9a9aae; --line:#26262f; --ok:#4ade80; --warn:#fbbf24; --live:#60a5fa; }
  * { box-sizing: border-box; min-width: 0; }
  html, body { height: 100%; }
  body { margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
         font:14px/1.45 ui-sans-serif,-apple-system,system-ui,sans-serif;
         display:flex; flex-direction:column; }
  header { display:flex; gap:10px; align-items:baseline; padding:11px 14px;
           border-bottom:1px solid var(--line); flex:0 0 auto; }
  h1 { margin:0; font-size:14px; font-weight:600; letter-spacing:.02em; }
  .meta { color:var(--dim); font-size:12px; overflow-wrap:anywhere; }
  main { flex:1 1 auto; display:grid; min-height:0;
         grid-template-columns:minmax(0,290px) minmax(0,1.15fr) minmax(0,1fr); }
  /* Below 1200px the diff would be unreadable beside a terminal, so it becomes a
     tab rather than a third column. */
  @media (max-width: 1200px) {
    main { grid-template-columns:minmax(0,280px) minmax(0,1fr); }
    .changes { display:none; }
    main.changes-on .changes { display:flex; }
    main.changes-on .pane { display:none; }
  }
  .list { border-right:1px solid var(--line); overflow-y:auto; padding:10px; display:grid;
          gap:7px; align-content:start; min-width:0; }
  .w { background:var(--panel); border:1px solid var(--line); border-radius:9px;
       padding:9px 10px; cursor:pointer; }
  .w.on { border-color:#3a3a55; background:var(--elev); }
  .top { display:flex; gap:6px; align-items:baseline; flex-wrap:wrap; }
  .br { font-weight:600; overflow-wrap:anywhere; font-size:13px; }
  .tag { font-size:10.5px; color:var(--dim); border:1px solid var(--line); border-radius:5px;
         padding:0 5px; white-space:nowrap; }
  .tag.live { color:var(--live); border-color:#2b4a72; }
  .tag.blocked { color:var(--warn); border-color:#5a4416; }
  .tag.up { color:var(--ok); border-color:#1f5133; }
  .sub { color:var(--dim); font-size:11.5px; margin-top:3px; overflow-wrap:anywhere; }
  .pane, .changes { display:flex; flex-direction:column; min-width:0; min-height:0; }
  .changes { border-left:1px solid var(--line); }
  .chbody { flex:1 1 auto; overflow-y:auto; padding:8px 10px; }
  .chsect { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.05em;
            margin:10px 0 5px; display:flex; justify-content:space-between; gap:8px; }
  .chrow { display:flex; gap:8px; align-items:baseline; padding:4px 6px; border-radius:6px;
           cursor:pointer; font-size:12.5px; }
  .chrow:hover { background:var(--elev); }
  .chrow.on { background:var(--elev); }
  .chrow .f { flex:1 1 auto; overflow-wrap:anywhere; font-family:ui-monospace,Menlo,monospace;
              font-size:11.5px; }
  .chrow .st { color:var(--dim); font-size:10.5px; width:2.2em; text-align:center;
               font-family:ui-monospace,Menlo,monospace; }
  .chrow .n { color:var(--dim); font-size:10.5px; white-space:nowrap; }
  .chrow .n .a { color:var(--ok); } .chrow .n .d { color:#f87171; }
  .chcommit { font-family:inherit; }
  .chcommit .sha { color:var(--dim); font-family:ui-monospace,Menlo,monospace; font-size:11px; }
  .chcommit .local { color:var(--warn); font-size:10px; }
  .diff { flex:1 1 auto; overflow:auto; font-family:ui-monospace,Menlo,monospace;
          font-size:11.5px; line-height:1.45; padding:0 0 10px; }
  .diff .hd { position:sticky; top:0; background:var(--panel); border-bottom:1px solid var(--line);
              padding:6px 10px; display:flex; gap:8px; align-items:center; z-index:1;
              font-family:inherit; }
  .diff .l { white-space:pre; padding:0 10px; }
  .diff .l.add { background:#0e2a17; color:#a7f3c0; }
  .diff .l.del { background:#2c1114; color:#fca5a5; }
  .diff .l.hunk { color:#93b4ff; background:#131a2b; }
  .diff .l.meta { color:var(--dim); }
  .bar { display:flex; gap:6px; align-items:center; padding:7px 10px; flex:0 0 auto;
         border-bottom:1px solid var(--line); overflow-x:auto; }
  .b { background:var(--elev); color:var(--ink); border:1px solid var(--line); border-radius:6px;
       padding:3px 9px; font-size:12px; cursor:pointer; white-space:nowrap; font-family:inherit; }
  .b:hover { border-color:#3a3a55; }
  .b.on { border-color:#4a6ea8; color:#cfe0ff; }
  .b.dead { color:var(--dim); text-decoration:line-through; }
  .term { flex:1 1 auto; min-height:0; padding:6px 2px 2px 8px; }
  .term .xterm { height:100%; }
  .empty { color:var(--dim); padding:14px; font-size:13px; }
  .empty.hint { padding-top:0; font-size:11.5px; opacity:.75; }
  .keys { display:none; gap:5px; padding:6px 8px; border-top:1px solid var(--line);
          flex:0 0 auto; overflow-x:auto; }
  /* ⤢ — the terminal takes the window; everything else gets out of the way. */
  body.full header, body.full .list, body.full nav { display:none; }
  body.full main { grid-template-columns:1fr; }
  nav { display:none; }
  /* One surface at a time on a phone, with the key bar a terminal needs there. */
  @media (max-width: 820px) {
    main { grid-template-columns:1fr; }
    .pane { display:none; }
    main.session .pane { display:flex; }
    main.session .list { display:none; }
    .keys { display:flex; }
    nav { display:flex; flex:0 0 auto; border-top:1px solid var(--line); }
    nav button { flex:1; background:none; border:0; color:var(--dim); padding:10px;
                 font:inherit; font-size:12px; }
    nav button.on { color:var(--ink); }
  }
</style>

<header>
  <h1 id="who">workmux</h1>
  <span class="meta" id="meta">loading…</span>
</header>

<main id="main">
  <div class="list" id="list"></div>
  <div class="pane">
    <div class="bar" id="bar"></div>
    <div class="term" id="term"></div>
    <div class="keys" id="keys"></div>
  </div>
  <div class="changes" id="changes">
    <div class="bar" id="chbar"></div>
    <div class="chbody" id="chbody"></div>
  </div>
</main>

<nav>
  <button id="nav-work" class="on" onclick="setSurface('work')">Work</button>
  <button id="nav-session" onclick="setSurface('session')">Session</button>
  <button id="nav-changes" onclick="setSurface('changes')">Changes</button>
</nav>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/xterm-addon-fit.js"></script>
<script>
// Plain DOM on purpose, for now: this is being replaced by a TS build that a mobile
// app will load as well, and porting the same logic twice is how details get lost.
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
                          if (x != null) n.textContent = x; return n; };
const $ = (id) => document.getElementById(id);

let STATE = null, WORK = [], SEL = null, SESSIONS = [], ACTIVE = null;
const PANES = new Map();   // session id → {term, fit, ws, dead}

// ---- work ----

async function poll() {
  let d;
  try { d = await (await fetch("/api/work")).json(); }
  catch { $("meta").textContent = "server unreachable"; return; }
  STATE = d; WORK = d.work || [];
  // Several instances at once is normal — one per project, plus one you're
  // developing — so the tab has to say which. Project first: titles truncate right.
  document.title = d.name ? d.name + " · workmux" : "workmux";
  $("who").textContent = d.name ? d.name + " · workmux" : "workmux";
  $("meta").textContent = [WORK.length + " worktrees", "base " + d.base,
    d.stack_enabled ? "next " + d.next_slot : "no stack",
    (d.agent && d.agent.name) || "no agent"].join(" · ");
  if (!SEL || !WORK.some(w => w.path === SEL)) SEL = (WORK[0] || {}).path || null;
  renderWork();
  await refreshSessions();
  loadChanges(!CH || CH.for !== SEL);
}

function renderWork() {
  const list = $("list");
  list.textContent = "";
  if (!WORK.length) list.append(el("p", "empty", "No worktrees yet."));
  for (const w of WORK) {
    const card = el("div", "w" + (w.path === SEL ? " on" : ""));
    const top = el("div", "top");
    top.append(el("span", "br", w.branch));
    if (w.is_default) top.append(el("span", "tag", "base"));
    if (w.live) top.append(el("span", "tag live", "working"));
    if (w.tempo === "blocked") top.append(el("span", "tag blocked", "needs input"));
    if (w.stack) top.append(el("span", "tag up", "app " + w.stack.slot + " " + w.stack.up + "/" + w.stack.total));
    for (const n of (w.prs || []).slice(0, 3)) top.append(el("span", "tag", "#" + n));
    if (w.behind > 0) top.append(el("span", "tag", "⇣" + w.behind));
    card.append(top);
    const bits = [];
    for (const a of w.agents || []) bits.push((a.name || a.id) + (a.tempo ? " · " + a.tempo : ""));
    for (const s of w.sessions || []) bits.push("▸ " + (s.title || s.kind));
    if (bits.length) card.append(el("div", "sub", bits.join("  —  ")));
    card.onclick = () => {
      SEL = w.path; ACTIVE = null; CHFILE = null; CHREV = null;
      renderWork(); renderBar(); loadChanges(true);
    };
    list.append(card);
  }
}

const selected = () => WORK.find(w => w.path === SEL) || null;

// ---- sessions ----

async function refreshSessions() {
  try {
    const d = await (await fetch("/api/session/list")).json();
    SESSIONS = d.sessions || [];
  } catch { SESSIONS = []; }   // --no-terminal: the route isn't there at all
  renderBar();
}

function renderBar() {
  const bar = $("bar");
  bar.textContent = "";
  if (!STATE) return;
  if (STATE.terminal === false) {
    bar.append(el("span", "empty", "Terminals are off (--no-terminal)."));
    return;
  }
  const w = selected();
  if (!w) return;

  // Only this worktree's sessions, so a tab always means something here.
  const mine = SESSIONS.filter(s => s.cwd === SEL);
  for (const s of mine) {
    const b = el("button", "b" + (s.id === ACTIVE ? " on" : "") + (s.alive ? "" : " dead"),
                 s.title || s.kind);
    b.onclick = () => open(s.id);
    bar.append(b);
  }
  const caps = STATE.agent || {};
  const add = (label, fn, title) => {
    const b = el("button", "b", label);
    b.onclick = fn;
    if (title) b.title = title;
    bar.append(b);
  };
  // Absent capability, absent button: what this project can't do isn't offered.
  if (w.agents && w.agents.length && caps.attach) {
    add("❯ resume", () => start("resume"), "Take over this worktree's agent");
  } else if (caps.run) {
    add("＋ " + (caps.name || "agent"), () => start("agent"));
  }
  add("＋ shell", () => start("shell"));
  add("＋ git", () => start("git"));
  if (w.stack) add("＋ logs", () => start("logs"));
  if (ACTIVE) {
    add("⤢", toggleFull, "Give the terminal the whole window");
    add("A−", () => setFont(-1), "Smaller");
    add("A+", () => setFont(1), "Bigger");
    add("✕", () => kill(ACTIVE), "Kill this session");
  }
  if (!ACTIVE) showEmpty(mine.length);
}

function showEmpty(existing) {
  const t = $("term");
  t.textContent = "";
  t.append(el("div", "empty", existing
    ? "Pick a session above."
    : "No session here yet. Start one above — it lives in the server, so a reload reattaches."));
  t.append(el("div", "empty hint", CHORD_HELP));
}

async function start(kind) {
  const size = fitSize();
  let r;
  try {
    r = await (await fetch("/api/session/new", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ kind, cwd: SEL, cols: size.cols, rows: size.rows }),
    })).json();
  } catch { return; }
  if (r.error) {
    const t = $("term"); t.textContent = ""; t.append(el("div", "empty", r.error));
    return;
  }
  await refreshSessions();
  open(r.id);
}

async function kill(id) {
  await fetch("/api/session/kill", { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id }) }).catch(() => {});
  const p = PANES.get(id);
  if (p) { p.term.dispose(); PANES.delete(id); }
  if (ACTIVE === id) ACTIVE = null;
  await refreshSessions();
}

// open attaches a pane, reusing one we already have so switching back doesn't
// repaint from scratch.
function open(id) {
  ACTIVE = id;
  setSurface("session");
  const box = $("term");
  box.textContent = "";
  let pane = PANES.get(id);
  if (!pane) {
    const term = new Terminal({
      fontSize: FONT, lineHeight: 1.25,
      fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
      cursorBlink: true, scrollback: 8000,
      // ⌥ must reach the program as a meta prefix, or word-wise editing does nothing.
      macOptionIsMeta: true, allowProposedApi: true,
      theme: { background: "#0e0e13", foreground: "#e7e7ee", cursor: "#e7e7ee",
               selectionBackground: "#2b3a55" },
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    pane = { term, fit, ws: null, dead: false };
    PANES.set(id, pane);
    // macOS line-editing habits the browser swallows before xterm sees them, mapped
    // to the control codes a readline or TUI actually listens for. Without these,
    // ⌘⏎ submits instead of adding a newline and ⌘← does nothing at all.
    const CHORDS = [
      [e => e.metaKey && e.key === "Enter", "\x1b\r"],      // newline, don't submit
      [e => e.shiftKey && e.key === "Enter", "\x1b\r"],     // same, for a phone
      [e => e.metaKey && e.key === "ArrowLeft", "\x01"],     // start of line (⌃A)
      [e => e.metaKey && e.key === "ArrowRight", "\x05"],    // end of line (⌃E)
      [e => e.metaKey && e.key === "Backspace", "\x15"],     // kill to start (⌃U)
      [e => e.altKey && e.key === "ArrowLeft", "\x1bb"],     // word left
      [e => e.altKey && e.key === "ArrowRight", "\x1bf"],    // word right
      [e => e.altKey && e.key === "Backspace", "\x1b\x7f"], // kill word
    ];
    term.attachCustomKeyEventHandler((e) => {
      if (e.type !== "keydown") return true;
      for (const [match, bytes] of CHORDS) {
        if (match(e)) {
          e.preventDefault();
          send(pane, new TextEncoder().encode(bytes));
          return false;
        }
      }
      return true;   // ⌘C/⌘V and the rest belong to the browser
    });
  }
  pane.term.open(box);
  pane.fit.fit();
  if (!pane.ws || pane.ws.readyState > 1) connect(id, pane);
  pane.term.focus();
  renderBar();
  renderKeys();
}

function connect(id, pane) {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const { cols, rows } = pane.term;
  const ws = new WebSocket(
    `${proto}//${location.host}/api/session/socket/${id}?cols=${cols}&rows=${rows}`);
  ws.binaryType = "arraybuffer";
  pane.ws = ws;
  // The server replays the scrollback on attach, so clear first or a reconnect
  // paints everything twice.
  ws.onopen = () => pane.term.reset();
  ws.onmessage = (ev) => {
    if (typeof ev.data === "string") {
      let msg = {};
      try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.t === "exit") { pane.dead = true; refreshSessions(); }
      return;
    }
    // Bytes, not a decoded string: a multi-byte character split across two frames
    // decodes to garbage if each frame is decoded on its own. xterm reassembles.
    pane.term.write(new Uint8Array(ev.data));
  };
  ws.onclose = () => { pane.dead = true; renderBar(); };
  // Keystrokes go as raw bytes: what the terminal emits is what the program reads,
  // with nothing in between to escape or misinterpret.
  const enc = new TextEncoder();
  pane.term.onData((d) => send(pane, enc.encode(d)));
  pane.term.onResize(({ cols, rows }) => {
    // Only the pane you are actually looking at reports its size. A hidden pane, or
    // a backgrounded tab, reporting one is how the PTY ended up oscillating between
    // two sizes and shredding the screen.
    if (document.hidden || ACTIVE !== id) return;
    send(pane, JSON.stringify({ t: "size", cols, rows }));
  });
}

// A terminal can't carry an image, but an agent takes a *path* — so a pasted
// screenshot is uploaded and its path typed in for you. "Here's what it looks like,
// fix it" is half of working with an agent, and it was simply impossible before.
async function pasteImages(items, insert) {
  const files = [];
  for (const item of items || []) {
    if (item.kind === "file" && (item.type || "").startsWith("image/")) {
      const f = item.getAsFile();
      if (f) files.push(f);
    }
  }
  if (!files.length) return false;
  for (const f of files) {
    let r;
    try {
      r = await (await fetch("/api/upload", { method: "POST",
        headers: { "Content-Type": f.type }, body: f })).json();
    } catch { insert("[upload failed]"); continue; }
    if (r.clipboard) {
      // The image is on the host clipboard, so ⌃V lets the agent read it directly —
      // no path in the prompt, just its own attachment marker.
      insert("\x16");
    } else if (r.path) {
      // No shared clipboard (a remote instance): fall back to pasting the path, in
      // bracketed-paste markers so it arrives as a paste rather than as typing.
      insert("\x1b[200~" + r.path + "\x1b[201~");
    } else {
      insert("[" + (r.error || "upload failed") + "]");
    }
  }
  return true;
}

function send(pane, data) {
  if (pane && pane.ws && pane.ws.readyState === 1) pane.ws.send(data);
}
function sendText(text) { send(PANES.get(ACTIVE), new TextEncoder().encode(text)); }

// Font size survives a reload: on a phone the default is unreadable for some people
// and too big for others, and re-setting it every time is the kind of small friction
// that stops you using the thing.
let FONT = +localStorage.getItem("workmux.font") ||
           (window.matchMedia("(max-width: 820px)").matches ? 11 : 12.5);
function setFont(delta) {
  FONT = Math.max(8, Math.min(22, FONT + delta));
  localStorage.setItem("workmux.font", String(FONT));
  for (const p of PANES.values()) { p.term.options.fontSize = FONT; p.fit.fit(); }
}
function toggleFull() {
  document.body.classList.toggle("full");
  const p = PANES.get(ACTIVE);
  if (p) { setTimeout(() => { p.fit.fit(); p.term.focus(); }, 0); }
}

// The terminal: xterm.js pastes text itself, so only images need handling here.
$("term").addEventListener("paste", (e) => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  const hasImage = [...items].some(i => i.kind === "file" && (i.type || "").startsWith("image/"));
  if (!hasImage) return;
  e.preventDefault();
  pasteImages(items, sendText);
}, true);

function fitSize() {
  const p = PANES.get(ACTIVE);
  if (p) return { cols: p.term.cols, rows: p.term.rows };
  // Nothing open yet: estimate from the box, so the first paint isn't 80×24 inside
  // a window twice that wide.
  const box = $("term").getBoundingClientRect();
  return { cols: Math.max(20, Math.floor(box.width / 7.2)),
           rows: Math.max(6, Math.floor(box.height / 17)) };
}

// A phone keyboard has none of these, and a terminal is unusable without them.
const KEYS = [["esc", "\x1b"], ["tab", "\t"], ["⌃C", "\x03"], ["⌃D", "\x04"],
              ["⇧⏎", "\x1b\r"], ["↑", "\x1b[A"], ["↓", "\x1b[B"],
              ["←", "\x1b[D"], ["→", "\x1b[C"], ["⏎", "\r"]];
// A chord nobody knows about may as well not exist, so the pane says what it has.
const CHORD_HELP = "⌘⏎ newline · ⇧⏎ newline · ⌘←/→ line start/end · ⌥←/→ by word · " +
                   "⌘⌫ kill line · ⌥⌫ kill word · paste an image to send its path";
function renderKeys() {
  const box = $("keys");
  box.textContent = "";
  if (!ACTIVE) return;
  for (const [label, seq] of KEYS) {
    const b = el("button", "b", label);
    b.onclick = () => {
      const p = PANES.get(ACTIVE);
      if (p && p.ws && p.ws.readyState === 1) p.ws.send(new TextEncoder().encode(seq));
      if (p) p.term.focus();
    };
    box.append(b);
  }
}

// ---- changes ----

let CH = null, CHFILE = null, CHREV = null;

async function loadChanges(force) {
  const w = selected();
  if (!w) return;
  if (!force && CH && CH.for === SEL) return renderChanges();
  try {
    const d = await (await fetch("/api/changes?path=" + encodeURIComponent(SEL)
      + "&base=" + encodeURIComponent(w.base || ""))).json();
    CH = d; CH.for = SEL;
  } catch { CH = null; }
  renderChanges();
}

function renderChanges() {
  const bar = $("chbar"), body = $("chbody");
  bar.textContent = ""; body.textContent = "";
  const w = selected();
  if (!w) return;
  // Looking at a diff: the way back has to be obvious, especially on a phone where
  // it replaced the list entirely.
  if (CHFILE || CHREV) {
    const back = el("button", "b", "‹ files");
    back.onclick = () => { CHFILE = null; CHREV = null; renderChanges(); };
    bar.append(back);
    bar.append(el("span", "meta", CHFILE || CHREV));
    body.textContent = "";
    body.append(el("div", "empty", "loading…"));
    return;
  }
  const refresh = el("button", "b", "↻");
  refresh.title = "Re-read the worktree";
  refresh.onclick = () => loadChanges(true);
  bar.append(refresh);
  bar.append(el("span", "meta", (CH && CH.branch) || w.branch));

  if (!CH) { body.append(el("div", "empty", "Couldn't read this worktree.")); return; }

  const files = CH.files || [], commits = CH.commits || [];
  const head = (label, count) => {
    const h = el("div", "chsect");
    h.append(el("span", null, label), el("span", null, String(count)));
    return h;
  };
  body.append(head("Working tree", files.length + (files.length === 1 ? " file" : " files")));
  if (!files.length) body.append(el("div", "empty", "Nothing uncommitted."));
  for (const f of files) {
    const row = el("div", "chrow" + (f.path === CHFILE ? " on" : ""));
    row.append(el("span", "st", (f.x + f.y).trim() || "??"));
    row.append(el("span", "f", f.path));
    const n = el("span", "n");
    if (f.add) n.append(el("span", "a", "+" + f.add));
    if (f.add && f.del) n.append(document.createTextNode(" "));
    if (f.del) n.append(el("span", "d", "−" + f.del));
    row.append(n);
    row.onclick = () => showFileDiff(f);
    body.append(row);
  }

  body.append(head("Commits ahead of " + (CH.base || w.base || "base"), commits.length));
  if (!commits.length) body.append(el("div", "empty", "Nothing this base doesn't have."));
  for (const c of commits) {
    const row = el("div", "chrow chcommit" + (c.sha === CHREV ? " on" : ""));
    row.append(el("span", "sha", c.sha));
    row.append(el("span", "f", c.msg));
    if (!c.pushed) row.append(el("span", "local", "local"));
    row.onclick = () => showCommitDiff(c);
    body.append(row);
  }
}

async function showFileDiff(f) {
  CHFILE = f.path; CHREV = null;
  renderChanges();
  let d;
  try {
    d = await (await fetch("/api/diff?path=" + encodeURIComponent(SEL)
      + "&file=" + encodeURIComponent(f.path) + (f.staged ? "&staged=1" : ""))).json();
  } catch { d = { error: "could not read the diff" }; }
  paintDiff(f.path, d.diff, d.error);
}

async function showCommitDiff(c) {
  CHREV = c.sha; CHFILE = null;
  renderChanges();
  let d;
  try {
    d = await (await fetch("/api/diff?path=" + encodeURIComponent(SEL)
      + "&rev=" + encodeURIComponent(c.sha))).json();
  } catch { d = { error: "could not read the commit" }; }
  paintDiff(c.sha + "  " + c.msg, d.diff, d.error);
}

// A diff is rendered line by line rather than as one blob so additions and
// deletions can be coloured, and so the header can stay put while you scroll.
function paintDiff(title, diff, error) {
  const body = $("chbody");
  body.textContent = "";
  const box = el("div", "diff");
  const hd = el("div", "hd");
  const back = el("button", "b", "‹ files");
  back.onclick = () => { CHFILE = null; CHREV = null; renderChanges(); };
  hd.append(back, el("span", "meta", title));
  box.append(hd);
  if (error) { box.append(el("div", "empty", error)); body.append(box); return; }
  if (!diff) { box.append(el("div", "empty", "No changes in this file.")); body.append(box); return; }
  for (const line of diff.split("\n")) {
    let cls = "l";
    if (line.startsWith("@@")) cls += " hunk";
    else if (line.startsWith("+++") || line.startsWith("---") || line.startsWith("diff ")
             || line.startsWith("index ") || line.startsWith("new file")
             || line.startsWith("deleted file")) cls += " meta";
    else if (line.startsWith("+")) cls += " add";
    else if (line.startsWith("-")) cls += " del";
    box.append(el("div", cls, line || " "));
  }
  body.append(box);
}

function setSurface(which) {
  const m = $("main");
  m.classList.toggle("session", which === "session");
  m.classList.toggle("changes-on", which === "changes");
  $("nav-work").classList.toggle("on", which === "work");
  $("nav-session").classList.toggle("on", which === "session");
  $("nav-changes").classList.toggle("on", which === "changes");
  if (which === "changes") loadChanges(false);
  const p = PANES.get(ACTIVE);
  if (which === "session" && p) { p.fit.fit(); p.term.focus(); }
}

// Refit on rotate, on window changes, and when a phone keyboard appears — that
// changes the visible height without firing a window resize on iOS.
const refit = () => { const p = PANES.get(ACTIVE); if (p) p.fit.fit(); };
window.addEventListener("resize", refit);
if (window.visualViewport) window.visualViewport.addEventListener("resize", refit);

poll();
setInterval(poll, 4000);
</script>
