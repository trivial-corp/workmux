<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>workmux</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
/* workmux — a patch bay for parallel work.
 *
 * The design idea: each piece of work is a channel strip. A status rail down its
 * left edge carries the one thing you need at a glance, the machine strings
 * (branches, shas, slots, counts) are set in mono because they *are* the content,
 * and colour is spent only on state — never on decoration. Strips are grouped into
 * bands, so the ordering the server computes is visible instead of implied.
 */
:root {
  color-scheme: dark;
  --ink:#0A0C0F; --panel:#11151A; --elev:#161B22; --elev-2:#1B212A;
  --line:#212932; --line-soft:#181E26;
  --t1:#E4E9F0; --t2:#A9B4C4; --t3:#77839A;
  --wants:#F0B429; --live:#2ED3C6; --idle:#5C6675; --up:#4ADE80;
  --danger:#F27272; --accent:#8AA0FF;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --r:7px;
}
* { box-sizing:border-box; min-width:0; }
html, body { height:100%; }
body { margin:0; background:var(--ink); color:var(--t1); font:13px/1.5 var(--sans);
       overflow:hidden; display:flex; flex-direction:column;
       -webkit-font-smoothing:antialiased; }
button { font:inherit; color:inherit; }
::selection { background:#2b3a55; }

/* ── header ──────────────────────────────────────────────────────────────── */
header { flex:0 0 auto; display:flex; align-items:center; gap:14px; padding:0 12px;
         height:46px; border-bottom:1px solid var(--line); background:var(--panel); }
.brand { font-family:var(--mono); font-size:13px; letter-spacing:-0.01em; white-space:nowrap;
         display:flex; align-items:baseline; gap:5px; flex:0 0 auto; }
.brand .proj { font-weight:600; color:var(--t1); }
.brand .tool { color:var(--t3); font-size:11px; }
.stats { display:flex; gap:0; align-items:center; flex:1 1 auto; overflow:hidden;
         font-family:var(--mono); font-size:11px; color:var(--t3); }
.stats span { padding:0 9px; border-left:1px solid var(--line-soft); white-space:nowrap; }
.stats span:first-child { border-left:0; padding-left:0; }
.acts { display:flex; gap:6px; flex:0 0 auto; }

/* ── buttons: one shape, three weights ───────────────────────────────────── */
.b { background:transparent; border:1px solid var(--line); border-radius:var(--r);
     padding:4px 9px; font-size:12px; cursor:pointer; white-space:nowrap;
     color:var(--t2); transition:border-color .12s, color .12s, background .12s; }
.b:hover { border-color:#31404f; color:var(--t1); background:var(--elev); }
.b:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.b.primary { border-color:#37436b; color:#c9d4ff; background:#1a1f33; }
.b.primary:hover { border-color:var(--accent); }
.b.danger:hover { border-color:#5c2b2b; color:var(--danger); background:#1e1315; }
.b.on { border-color:var(--accent); color:#cfe0ff; }
.b.dead { color:var(--t3); text-decoration:line-through; }
.b.icon { font-family:var(--mono); }
.b[disabled] { opacity:.5; cursor:default; }
.group { display:flex; gap:6px; padding-right:8px; margin-right:2px;
         border-right:1px solid var(--line-soft); }
.group:last-child { border-right:0; padding-right:0; }

/* ── layout ──────────────────────────────────────────────────────────────── */
main { flex:1 1 auto; display:grid; min-height:0;
       grid-template-columns:minmax(0,304px) minmax(0,1.1fr) minmax(0,0.95fr); }
.list, .pane, .changes { display:flex; flex-direction:column; min-width:0; min-height:0; }
.list { overflow-y:auto; border-right:1px solid var(--line); background:var(--panel); }
.changes { border-left:1px solid var(--line); background:var(--panel); }

/* ── bands: the ordering, made visible ───────────────────────────────────── */
.band { border-bottom:1px solid var(--line-soft); padding:0 0 6px; }
.band:last-child { border-bottom:0; }
.band > h2 { margin:0; padding:12px 12px 6px; font:inherit; font-size:10px; font-weight:600;
             letter-spacing:.15em; text-transform:uppercase; color:var(--t3);
             display:flex; align-items:center; gap:8px; }
.band > h2 .count { font-family:var(--mono); letter-spacing:0; font-weight:400; opacity:.7; }
.band > h2::after { content:""; flex:1 1 auto; height:1px; background:var(--line-soft); }
.band[data-tone="wants"] > h2 { color:var(--wants); }

/* ── the channel strip ───────────────────────────────────────────────────── */
.strip { display:flex; gap:10px; padding:7px 12px 8px 0; cursor:pointer; position:relative;
         border-left:0; }
.strip:hover { background:var(--elev); }
.strip[aria-selected="true"] { background:var(--elev-2); box-shadow:inset 0 0 0 1px #2b3444; }
.strip[aria-selected="true"] .rail { width:3px; box-shadow:0 0 10px 0 currentColor; }
.strip[aria-selected="true"] .branch { color:#fff; }
.strip .rail { flex:0 0 3px; border-radius:0 2px 2px 0; background:var(--idle);
               margin-right:1px; }
.strip[data-tone="wants"] .rail { background:var(--wants); }
.strip[data-tone="live"]  .rail { background:var(--live); }
.strip[data-tone="up"]    .rail { background:var(--up); }
.strip[data-tone="base"]  .rail { background:#2a313b; }
/* The one moving thing in the interface: work in progress breathes. */
@media (prefers-reduced-motion: no-preference) {
  .strip[data-tone="live"] .rail { animation:breathe 2.6s ease-in-out infinite; }
}
@keyframes breathe { 0%,100% { opacity:1 } 50% { opacity:.45 } }
.strip .body { flex:1 1 auto; display:grid; gap:3px; }
.strip .branch { font-family:var(--mono); font-size:12.5px; font-weight:600; color:var(--t1);
                 overflow-wrap:anywhere; }
.strip[data-tone="base"] .branch { font-weight:400; color:var(--t2); }
.strip .said { font-size:11.5px; color:var(--t2); overflow:hidden; text-overflow:ellipsis;
               white-space:nowrap; }
.strip .chips { display:flex; flex-wrap:wrap; gap:4px 6px; align-items:center;
                font-family:var(--mono); font-size:10.5px; color:var(--t3); }
.chip { display:inline-flex; align-items:center; gap:4px; }
.chip.state { color:var(--wants); }
.chip.app { color:var(--up); }
.chip.pr { color:var(--t3); }
.chip.pr::before { content:""; }
.dot { width:5px; height:5px; border-radius:50%; background:currentColor; flex:0 0 auto; }

/* ── session pane ────────────────────────────────────────────────────────── */
.bar { flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:7px 10px;
       border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none;
       background:var(--panel); }
.bar::-webkit-scrollbar { display:none; }
.bar .who { font-family:var(--mono); font-size:11px; color:var(--t3); white-space:nowrap;
            overflow:hidden; text-overflow:ellipsis; }
.term { flex:1 1 auto; min-height:0; padding:8px 4px 4px 10px; background:var(--ink); }
.term .xterm { height:100%; }
.hollow { padding:20px 16px; max-width:52ch; display:grid; gap:10px; }
.hollow h3 { margin:0; font-size:13px; font-weight:600; color:var(--t2); }
.hollow p { margin:0; font-size:12.5px; color:var(--t3); }
.hollow h3 { font-family:var(--mono); font-size:13px; color:var(--t1); }
.facts { margin:8px 0 0; display:grid; grid-template-columns:auto 1fr; gap:5px 14px;
         font-family:var(--mono); font-size:11.5px; align-items:baseline; }
.facts dt { color:var(--t3); text-align:right; }
.facts dd { margin:0; color:var(--t2); overflow-wrap:anywhere; }
.keys { display:none; gap:5px; padding:6px 8px; border-top:1px solid var(--line);
        flex:0 0 auto; overflow-x:auto; scrollbar-width:none; }

/* ── changes ─────────────────────────────────────────────────────────────── */
.chbody { flex:1 1 auto; overflow-y:auto; padding:0 0 12px; }
.chsect { padding:12px 12px 5px; font-size:10px; font-weight:600; letter-spacing:.15em;
          text-transform:uppercase; color:var(--t3); display:flex; gap:8px; align-items:center; }
.chsect .count { font-family:var(--mono); letter-spacing:0; font-weight:400; }
.chsect::after { content:""; flex:1 1 auto; height:1px; background:var(--line-soft); }
.chrow { display:flex; gap:10px; align-items:baseline; padding:4px 12px; cursor:pointer; }
.chrow:hover { background:var(--elev); }
.chrow[aria-selected="true"] { background:var(--elev-2); }
.chrow .st { font-family:var(--mono); font-size:10px; color:var(--t3); flex:0 0 2ch;
             text-align:center; }
.chrow .f { flex:1 1 auto; font-family:var(--mono); font-size:11.5px; overflow-wrap:anywhere; }
.chrow .n { font-family:var(--mono); font-size:10.5px; white-space:nowrap; color:var(--t3); }
.chrow .n .a { color:var(--up); } .chrow .n .d { color:var(--danger); }
/* A sha is a fixed-width label, and it gets its own room: it ran into the subject. */
.chrow .sha { flex:0 0 9ch; font-family:var(--mono); font-size:10.5px; color:var(--accent);
              opacity:.85; }
.chrow .subject { flex:1 1 auto; font-size:12px; color:var(--t2); overflow-wrap:anywhere; }
.chrow .local { font-family:var(--mono); font-size:10px; color:var(--wants); flex:0 0 auto; }
.diff { flex:1 1 auto; overflow:auto; }
.diff .hd { position:sticky; top:0; z-index:1; background:var(--panel);
            border-bottom:1px solid var(--line); padding:7px 10px; display:flex; gap:8px;
            align-items:center; }
.diff .hd .name { font-family:var(--mono); font-size:11px; color:var(--t2); overflow:hidden;
                  text-overflow:ellipsis; white-space:nowrap; }
.diff .l { white-space:pre; padding:0 10px; font-family:var(--mono); font-size:11.5px;
           line-height:1.5; }
.diff .l.add { background:#0d2618; color:#a7f3c0; }
.diff .l.del { background:#261013; color:#fcaaaa; }
.diff .l.hunk { background:#131a2b; color:#93b4ff; }
.diff .l.meta { color:var(--t3); }

/* ── sheets ──────────────────────────────────────────────────────────────── */
.scrim { position:fixed; inset:0; background:#000c; display:none; z-index:9; }
.scrim.on { display:block; }
.sheet { position:fixed; z-index:10; display:none; flex-direction:column; left:50%; top:50%;
         transform:translate(-50%,-50%); width:min(680px,94vw); max-height:min(84vh,780px);
         background:var(--panel); border:1px solid var(--line); border-radius:12px;
         box-shadow:0 24px 60px #000a; overflow:hidden; }
.sheet.on { display:flex; }
.shead, .sfoot { flex:0 0 auto; display:flex; gap:8px; align-items:center; padding:11px 13px; }
.shead { border-bottom:1px solid var(--line); }
.shead strong { font-size:13px; font-weight:600; }
.sfoot { border-top:1px solid var(--line); }
.sfoot:empty { display:none; }
.sbody { flex:1 1 auto; overflow-y:auto; padding:13px; display:grid; gap:10px;
         align-content:start; }
.sheet textarea, .sheet input, .sheet select {
  width:100%; background:var(--ink); color:var(--t1); border:1px solid var(--line);
  border-radius:var(--r); padding:8px 9px; font:inherit; font-size:13px; }
.sheet textarea { min-height:92px; resize:vertical; font-family:var(--sans); }
.sheet textarea:focus, .sheet input:focus, .sheet select:focus {
  outline:none; border-color:var(--accent); }
.sheet label { display:grid; gap:5px; font-size:11px; color:var(--t3);
               letter-spacing:.02em; }
.note { font-size:11.5px; color:var(--t3); line-height:1.6; }
.row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.spacer { flex:1 1 auto; }
.srv { border:1px solid var(--line); border-radius:var(--r); padding:9px 10px; display:grid;
       gap:4px; }
.srv .nm { display:flex; align-items:center; gap:7px; font-family:var(--mono); font-size:12px;
           font-weight:600; overflow-wrap:anywhere; }
.srv .scope { font-family:var(--mono); font-size:10px; color:var(--t3); border:1px solid var(--line);
              border-radius:4px; padding:0 4px; font-weight:400; }
.srv .dt { font-size:11px; color:var(--t3); overflow-wrap:anywhere; font-family:var(--mono); }
.srv .dot { width:6px; height:6px; }
.srv[data-state="ok"] .dot { background:var(--up); }
.srv[data-state="fail"] .dot { background:var(--danger); }
.srv[data-state="auth"] .dot { background:var(--wants); }
.srv[data-state="pending"] .dot { background:var(--idle); }
.logline { display:flex; gap:9px; align-items:baseline; font-family:var(--mono);
           font-size:11px; line-height:1.65; }
.logline .t { color:var(--t3); flex:0 0 auto; }
.logline .m { overflow-wrap:anywhere; color:var(--t2); }
.logline.bad .m { color:var(--danger); }
.logline.warn .m { color:var(--wants); }
.sbody.log { gap:0; font-variant-numeric:tabular-nums; }

/* ── phone / tablet: exactly one surface, one rule ───────────────────────── */
nav { display:none; }
@media (max-width:1280px) {
  main { grid-template-columns:minmax(0,280px) minmax(0,1fr); }
  main .changes { display:none; }
  main[data-surface="changes"] .changes { display:flex; }
  main[data-surface="changes"] .pane { display:none; }
}
@media (max-width:900px) {
  main { grid-template-columns:1fr; }
  /* One rule decides what is visible, so two of them can't disagree — which is how
     the work list and the diff ended up stacked on top of each other.
     Class selectors, not `main > *`: a class beats an element whatever the order, so
     the base `.list { display:flex }` was quietly winning against it. */
  main .list, main .pane, main .changes { display:none; }
  main[data-surface="work"] .list,
  main[data-surface="session"] .pane,
  main[data-surface="changes"] .changes { display:flex; }
  .keys { display:flex; }
  nav { display:flex; flex:0 0 auto; border-top:1px solid var(--line); background:var(--panel);
        padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; background:none; border:0; color:var(--t3); padding:11px 0 10px;
               font-size:11px; letter-spacing:.04em; }
  nav button[aria-current="true"] { color:var(--t1); box-shadow:inset 0 -2px 0 var(--accent); }
  .sheet { inset:0; width:100%; max-height:100%; border-radius:0; transform:none; left:0; top:0; }
  .stats span:nth-child(n+3) { display:none; }
}
.b.narrow { display:none; }
@media (max-width:560px) {
  header { gap:8px; padding:0 10px; }
  .brand .tool { display:none; }
  .stats span:nth-child(n+2) { display:none; }
  .b .lbl { display:none; }
  .b.wide { display:none; }
  .b.narrow { display:inline-block; }
}
body.full header, body.full .list, body.full .changes, body.full nav { display:none; }
body.full main { grid-template-columns:1fr; }
body.full main .pane { display:flex; }
.toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:20;
         display:none; max-width:min(90vw,52ch); padding:9px 13px; border-radius:var(--r);
         background:var(--elev-2); border:1px solid #5c452b; color:var(--wants);
         font-size:12.5px; box-shadow:0 12px 30px #000a; }
.toast.on { display:block; }
</style>

<header>
  <div class="brand"><span class="proj" id="proj">…</span><span class="tool">workmux</span></div>
  <div class="stats" id="stats"></div>
  <div class="acts">
    <button class="b primary" onclick="openSheet('new')" title="Start a new piece of work (⌘N)">
      ＋<span class="lbl"> New work</span></button>
    <button class="b wide" id="btn-mcp" onclick="openSheet('mcp')" title="MCP servers">
      ◇<span class="lbl"> MCP</span></button>
    <button class="b wide" onclick="openSheet('log')" title="This server's own log">
      ▤<span class="lbl"> Log</span></button>
    <button class="b icon narrow" onclick="openSheet('more')" title="More">⋯</button>
    <button class="b icon" onclick="poll()" title="Refresh">↻</button>
  </div>
</header>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="shead"><strong id="stitle">…</strong><span class="spacer"></span>
    <button class="b" onclick="closeSheet()">Close</button></div>
  <div class="sbody" id="sbody"></div>
  <div class="sfoot" id="sfoot"></div>
</div>

<main id="main" data-surface="work">
  <div class="list" id="list"></div>
  <div class="pane">
    <div class="bar" id="bar"></div>
    <div class="term" id="term"></div>
    <div class="keys" id="keys"></div>
  </div>
  <div class="changes">
    <div class="bar" id="chbar"></div>
    <div class="chbody" id="chbody"></div>
  </div>
</main>

<nav>
  <button id="nav-work" aria-current="true" onclick="setSurface('work')">Work</button>
  <button id="nav-session" onclick="setSurface('session')">Session</button>
  <button id="nav-changes" onclick="setSurface('changes')">Changes</button>
</nav>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/xterm-addon-fit.js"></script>
<script>
// Plain DOM on purpose, for now: this is being replaced by a TS build that a mobile
// app will load as well, and porting the same logic twice is how details get lost.
const el = (t, c, x) => {
  const n = document.createElement(t);
  if (c) n.className = c;
  if (x != null) n.append(x);          // a string or a node — both are appended
  return n;
};
const $ = (id) => document.getElementById(id);

let STATE = null, WORK = [], SEL = null, SESSIONS = [], ACTIVE = null;
const PANES = new Map();   // session id → {term, fit, ws, dead}

// ---- work ----

async function poll() {
  let d;
  try { d = await (await fetch("/api/work")).json(); }
  catch { $("stats").textContent = "server unreachable"; return; }
  STATE = d; WORK = d.work || [];
  // One instance per project is the normal case, so the tab has to say which. The
  // project comes first because titles truncate from the right.
  document.title = d.name ? d.name + " · workmux" : "workmux";
  $("proj").textContent = d.name || "workmux";
  const stats = $("stats");
  stats.textContent = "";
  const chip = (t) => stats.append(el("span", null, t));
  const wants = WORK.filter(w => w.tempo === "blocked").length;
  const live = WORK.filter(w => w.live).length;
  chip(WORK.length + " trees");
  if (wants) chip(wants + " waiting");
  if (live) chip(live + " working");
  chip(d.base);
  if (d.stack_enabled) chip("next " + d.next_slot);
  $("btn-mcp").hidden = !(d.agent && d.agent.mcp);
  if (!SEL || !WORK.some(w => w.path === SEL)) SEL = (WORK[0] || {}).path || null;
  renderWork();
  await refreshSessions();
  loadChanges(!CH || CH.for !== SEL);
}

// Bands make the server's ordering visible. It already sorts by what wants you, but
// a flat list of identical cards hides that entirely — which is the difference
// between a list you read and a list you scan.
const BANDS = [
  { key:"wants", label:"Wants you",  tone:"wants", has:(w) => w.tempo === "blocked" },
  { key:"live",  label:"Working",    tone:"live",  has:(w) => w.live || w.tempo === "active" },
  { key:"up",    label:"App running",tone:"up",    has:(w) => !!w.stack },
  { key:"rest",  label:"Quiet",      tone:"idle",  has:() => true },
  { key:"base",  label:"Base checkout", tone:"base", has:() => false },
];

function renderWork() {
  const list = $("list");
  list.textContent = "";
  if (!WORK.length) {
    list.append(el("div", "hollow", "No worktrees yet."));
    return;
  }
  const taken = new Set();
  for (const band of BANDS) {
    const rows = WORK.filter(w => {
      if (taken.has(w.path)) return false;
      const mine = band.key === "base" ? w.is_default : (!w.is_default && band.has(w));
      if (mine) taken.add(w.path);
      return mine;
    });
    if (!rows.length) continue;
    const sec = el("section", "band");
    sec.dataset.tone = band.tone;
    const h = el("h2", null, band.label);
    h.append(el("span", "count", String(rows.length)));
    sec.append(h);
    for (const w of rows) sec.append(strip(w, band.tone));
    list.append(sec);
  }
}

function strip(w, tone) {
  const row = el("article", "strip");
  row.dataset.tone = tone;
  row.setAttribute("aria-selected", w.path === SEL ? "true" : "false");
  row.append(el("i", "rail"));
  const body = el("div", "body");
  body.append(el("div", "branch", w.branch));

  // What it last said, in its own words. This is the line you actually read.
  const agent = (w.agents || [])[0];
  if (agent) {
    const said = (agent.detail || agent.name || "").trim();
    if (said) body.append(el("div", "said", said));
  } else if (w.is_default) {
    body.append(el("div", "said", "where you're standing — not a change in flight"));
  }

  const chips = el("div", "chips");
  const add = (cls, text, dot) => {
    const c = el("span", "chip " + cls);
    if (dot) c.append(el("i", "dot"));
    c.append(document.createTextNode(text));
    chips.append(c);
  };
  if (w.tempo === "blocked") add("state", "needs you", true);
  else if (w.live) add("state", agent ? (agent.name || "working") : "working", true);
  if (w.stack) add("app", w.stack.slot + " " + w.stack.up + "/" + w.stack.total, true);
  for (const n of (w.prs || []).slice(0, 3)) add("pr", "#" + n);
  if (w.behind > 0) add("", "⇣" + w.behind);
  if (w.ahead > 0) add("", "⇡" + w.ahead);
  if (chips.children.length) body.append(chips);

  row.append(body);
  row.onclick = () => {
    SEL = w.path; ACTIVE = null; CHFILE = null; CHREV = null;
    renderWork(); renderBar(); loadChanges(true);
    if (window.matchMedia("(max-width:900px)").matches) setSurface("session");
  };
  return row;
}

const selected = () => WORK.find(w => w.path === SEL) || null;

// ---- sessions ----

async function refreshSessions() {
  try {
    const d = await (await fetch("/api/session/list")).json();
    SESSIONS = d.sessions || [];
  } catch { SESSIONS = []; }   // --no-terminal: the route isn't there at all
  renderBar();
}

function renderBar() {
  const bar = $("bar");
  bar.textContent = "";
  if (!STATE) return;
  if (STATE.terminal === false) {
    bar.append(el("span", "who", "Terminals are off — started with --no-terminal."));
    return;
  }
  const w = selected();
  if (!w) return;
  const caps = STATE.agent || {};
  const mine = SESSIONS.filter(s => s.cwd === SEL);
  const group = () => { const g = el("div", "group"); bar.append(g); return g; };
  const btn = (into, label, fn, opts) => {
    const b = el("button", "b" + (opts && opts.cls ? " " + opts.cls : ""), label);
    b.onclick = fn;
    if (opts && opts.title) b.title = opts.title;
    into.append(b);
    return b;
  };

  // Open sessions first: these are the tabs, and they're what you came for.
  if (mine.length) {
    const g = group();
    for (const s of mine) {
      btn(g, s.title || s.kind, () => open(s.id),
          { cls: (s.id === ACTIVE ? "on" : "") + (s.alive ? "" : " dead") });
    }
  }

  // Then how to start one. The agent is the primary action; everything else is a tool.
  const g2 = group();
  if (w.agents && w.agents.length && caps.attach) {
    btn(g2, "❯ resume", () => start("resume"), { cls: "primary", title: "Take over this worktree's agent" });
  } else if (caps.run) {
    btn(g2, "＋ " + (caps.name || "agent"), () => start("agent"), { cls: "primary" });
  }
  btn(g2, "＋ shell", () => start("shell"));
  btn(g2, "＋ git", () => start("git"), { title: "lazygit, tig, or a log" });
  if (w.stack) btn(g2, "＋ logs", () => start("logs"), { title: "Tail this work's containers" });

  // Then the app, then the branch. Grouped, so a destructive button never sits next
  // to the one you press all the time.
  if (STATE.stack_enabled) {
    const g3 = group();
    if (w.stack) {
      if (w.stack.url) btn(g3, "↗ open", () => window.open(w.stack.url, "_blank"),
                           { title: w.stack.url });
      btn(g3, "↻ restart", () => stackAction("restart", w));
      btn(g3, "■ stop", () => stackAction("stop", w), { cls: "danger" });
    } else {
      btn(g3, "▶ start app", () => stackAction("up", w),
          { title: "Containers for this work — it doesn't need them to exist" });
    }
  }
  const g4 = group();
  if (w.behind > 0) {
    btn(g4, "⇣ merge " + w.base, async (e) => {
      const b = e.target; b.disabled = true; b.textContent = "merging…";
      let r;
      try {
        r = await (await fetch("/api/update", { method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ path: SEL, base: w.base }) })).json();
      } catch { r = { error: "server unreachable" }; }
      if (r.error) toast(r.error); else toast("Merged " + w.base + " in");
      poll(); loadChanges(true);
    }, { title: "Bring in the " + w.behind + " commits this branch is behind" });
  }
  for (const n of (w.prs || []).slice(0, 2)) {
    if (STATE.repo_url) btn(g4, "#" + n, () => window.open(STATE.repo_url + "/pull/" + n, "_blank"),
                            { title: "Open PR #" + n });
  }
  if (ACTIVE) {
    const g5 = group();
    btn(g5, "⤢", toggleFull, { cls: "icon", title: "Whole window" });
    btn(g5, "A−", () => setFont(-1), { cls: "icon" });
    btn(g5, "A+", () => setFont(1), { cls: "icon" });
    btn(g5, "✕", () => kill(ACTIVE), { cls: "icon danger", title: "Kill this session" });
  }
  if (!ACTIVE) showEmpty(mine.length);
}

async function stackAction(action, w) {
  const slot = w.stack ? w.stack.slot : (STATE.next_slot || "");
  toast(action === "up" ? "Starting " + slot + "…" : action + "ing " + slot + "…");
  let r;
  try {
    r = await (await fetch("/api/stack", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action, slot, path: SEL }) })).json();
  } catch { r = { error: "server unreachable" }; }
  if (r.error) toast(r.error);
  else toast(action === "stop" ? slot + " stopped" : slot + " " + (action === "up" ? "started" : "restarted"));
  poll();
}

function showEmpty(existing) {
  const t = $("term");
  t.textContent = "";
  const w = selected();
  const box = el("div", "hollow");
  if (existing) {
    box.append(el("h3", null, "Pick a session above."));
    t.append(box);
    return;
  }
  box.append(el("h3", null, w ? w.branch : "Nothing selected"));
  box.append(el("p", null, (w && w.agents && w.agents.length)
    ? "Resume the agent to take over its session, or open a shell."
    : "Start the agent, a shell, or a git view. Sessions live in the server, so a reload reattaches."));
  // Facts about this work, so the pane says something while it's idle.
  if (w) {
    const facts = el("dl", "facts");
    const fact = (k, v) => { facts.append(el("dt", null, k)); facts.append(el("dd", null, v)); };
    fact("branch", w.branch);
    fact("base", w.base + (w.behind > 0 ? "  ⇣" + w.behind : "") + (w.ahead > 0 ? "  ⇡" + w.ahead : ""));
    for (const a of w.agents || []) fact("agent", (a.name || a.id) + (a.tempo ? "  " + a.tempo : ""));
    if (w.stack) fact("app", w.stack.slot + "  " + w.stack.up + "/" + w.stack.total + " up");
    else if (STATE && STATE.stack_enabled) fact("app", "not running");
    if ((w.prs || []).length) fact("prs", w.prs.map(n => "#" + n).join("  "));
    fact("path", w.path.replace(/^.*\/(?=[^/]+\/[^/]+$)/, "…/"));
    box.append(facts);
  }
  t.append(box);
}

async function start(kind) {
  const size = fitSize();
  let r;
  try {
    r = await (await fetch("/api/session/new", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ kind, cwd: SEL, cols: size.cols, rows: size.rows }),
    })).json();
  } catch { return; }
  if (r.error) {
    const t = $("term"); t.textContent = ""; t.append(el("div", "empty", r.error));
    return;
  }
  await refreshSessions();
  open(r.id);
}

async function kill(id) {
  await fetch("/api/session/kill", { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id }) }).catch(() => {});
  const p = PANES.get(id);
  if (p) { p.term.dispose(); PANES.delete(id); }
  if (ACTIVE === id) ACTIVE = null;
  await refreshSessions();
}

// open attaches a pane, reusing one we already have so switching back doesn't
// repaint from scratch.
function open(id) {
  ACTIVE = id;
  setSurface("session");
  const box = $("term");
  box.textContent = "";
  let pane = PANES.get(id);
  if (!pane) {
    const term = new Terminal({
      fontSize: FONT, lineHeight: 1.25,
      fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
      cursorBlink: true, scrollback: 8000,
      // ⌥ must reach the program as a meta prefix, or word-wise editing does nothing.
      macOptionIsMeta: true, allowProposedApi: true,
      theme: { background: "#0e0e13", foreground: "#e7e7ee", cursor: "#e7e7ee",
               selectionBackground: "#2b3a55" },
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    pane = { term, fit, ws: null, dead: false };
    PANES.set(id, pane);
    // macOS line-editing habits the browser swallows before xterm sees them, mapped
    // to the control codes a readline or TUI actually listens for. Without these,
    // ⌘⏎ submits instead of adding a newline and ⌘← does nothing at all.
    const CHORDS = [
      [e => e.metaKey && e.key === "Enter", "\x1b\r"],      // newline, don't submit
      [e => e.shiftKey && e.key === "Enter", "\x1b\r"],     // same, for a phone
      [e => e.metaKey && e.key === "ArrowLeft", "\x01"],     // start of line (⌃A)
      [e => e.metaKey && e.key === "ArrowRight", "\x05"],    // end of line (⌃E)
      [e => e.metaKey && e.key === "Backspace", "\x15"],     // kill to start (⌃U)
      [e => e.altKey && e.key === "ArrowLeft", "\x1bb"],     // word left
      [e => e.altKey && e.key === "ArrowRight", "\x1bf"],    // word right
      [e => e.altKey && e.key === "Backspace", "\x1b\x7f"], // kill word
    ];
    term.attachCustomKeyEventHandler((e) => {
      if (e.type !== "keydown") return true;
      for (const [match, bytes] of CHORDS) {
        if (match(e)) {
          e.preventDefault();
          send(pane, new TextEncoder().encode(bytes));
          return false;
        }
      }
      return true;   // ⌘C/⌘V and the rest belong to the browser
    });
  }
  pane.term.open(box);
  pane.fit.fit();
  if (!pane.ws || pane.ws.readyState > 1) connect(id, pane);
  pane.term.focus();
  renderBar();
  renderKeys();
}

function connect(id, pane) {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const { cols, rows } = pane.term;
  const ws = new WebSocket(
    `${proto}//${location.host}/api/session/socket/${id}?cols=${cols}&rows=${rows}`);
  ws.binaryType = "arraybuffer";
  pane.ws = ws;
  // The server replays the scrollback on attach, so clear first or a reconnect
  // paints everything twice.
  ws.onopen = () => pane.term.reset();
  ws.onmessage = (ev) => {
    if (typeof ev.data === "string") {
      let msg = {};
      try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.t === "exit") { pane.dead = true; refreshSessions(); }
      return;
    }
    // Bytes, not a decoded string: a multi-byte character split across two frames
    // decodes to garbage if each frame is decoded on its own. xterm reassembles.
    pane.term.write(new Uint8Array(ev.data));
  };
  ws.onclose = () => { pane.dead = true; renderBar(); };
  // Keystrokes go as raw bytes: what the terminal emits is what the program reads,
  // with nothing in between to escape or misinterpret.
  const enc = new TextEncoder();
  pane.term.onData((d) => send(pane, enc.encode(d)));
  pane.term.onResize(({ cols, rows }) => {
    // Only the pane you are actually looking at reports its size. A hidden pane, or
    // a backgrounded tab, reporting one is how the PTY ended up oscillating between
    // two sizes and shredding the screen.
    if (document.hidden || ACTIVE !== id) return;
    send(pane, JSON.stringify({ t: "size", cols, rows }));
  });
}

// A terminal can't carry an image, but an agent takes a *path* — so a pasted
// screenshot is uploaded and its path typed in for you. "Here's what it looks like,
// fix it" is half of working with an agent, and it was simply impossible before.
async function pasteImages(items, insert) {
  const files = [];
  for (const item of items || []) {
    if (item.kind === "file" && (item.type || "").startsWith("image/")) {
      const f = item.getAsFile();
      if (f) files.push(f);
    }
  }
  if (!files.length) return false;
  for (const f of files) {
    let r;
    try {
      r = await (await fetch("/api/upload", { method: "POST",
        headers: { "Content-Type": f.type }, body: f })).json();
    } catch { insert("[upload failed]"); continue; }
    if (r.clipboard) {
      // The image is on the host clipboard, so ⌃V lets the agent read it directly —
      // no path in the prompt, just its own attachment marker.
      insert("\x16");
    } else if (r.path) {
      // No shared clipboard (a remote instance): fall back to pasting the path, in
      // bracketed-paste markers so it arrives as a paste rather than as typing.
      insert("\x1b[200~" + r.path + "\x1b[201~");
    } else {
      insert("[" + (r.error || "upload failed") + "]");
    }
  }
  return true;
}

// Errors from an action belong next to the thing you clicked, not in a console.
let TOAST = null;
function toast(msg) {
  if (!TOAST) {
    TOAST = el("div", "toast");
    document.body.append(TOAST);
  }
  TOAST.textContent = msg;
  TOAST.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => TOAST.classList.remove("on"), 6000);
}

function send(pane, data) {
  if (pane && pane.ws && pane.ws.readyState === 1) pane.ws.send(data);
}
function sendText(text) { send(PANES.get(ACTIVE), new TextEncoder().encode(text)); }

// Font size survives a reload: on a phone the default is unreadable for some people
// and too big for others, and re-setting it every time is the kind of small friction
// that stops you using the thing.
let FONT = +localStorage.getItem("workmux.font") ||
           (window.matchMedia("(max-width: 820px)").matches ? 11 : 12.5);
function setFont(delta) {
  FONT = Math.max(8, Math.min(22, FONT + delta));
  localStorage.setItem("workmux.font", String(FONT));
  for (const p of PANES.values()) { p.term.options.fontSize = FONT; p.fit.fit(); }
}
function toggleFull() {
  document.body.classList.toggle("full");
  const p = PANES.get(ACTIVE);
  if (p) { setTimeout(() => { p.fit.fit(); p.term.focus(); }, 0); }
}

// The terminal: xterm.js pastes text itself, so only images need handling here.
$("term").addEventListener("paste", (e) => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  const hasImage = [...items].some(i => i.kind === "file" && (i.type || "").startsWith("image/"));
  if (!hasImage) return;
  e.preventDefault();
  pasteImages(items, sendText);
}, true);

function fitSize() {
  const p = PANES.get(ACTIVE);
  if (p) return { cols: p.term.cols, rows: p.term.rows };
  // Nothing open yet: estimate from the box, so the first paint isn't 80×24 inside
  // a window twice that wide.
  const box = $("term").getBoundingClientRect();
  return { cols: Math.max(20, Math.floor(box.width / 7.2)),
           rows: Math.max(6, Math.floor(box.height / 17)) };
}

// A phone keyboard has none of these, and a terminal is unusable without them.
const KEYS = [["esc", "\x1b"], ["tab", "\t"], ["⌃C", "\x03"], ["⌃D", "\x04"],
              ["⇧⏎", "\x1b\r"], ["↑", "\x1b[A"], ["↓", "\x1b[B"],
              ["←", "\x1b[D"], ["→", "\x1b[C"], ["⏎", "\r"]];
// A chord nobody knows about may as well not exist, so the pane says what it has.
const CHORD_HELP = "⌘⏎ newline · ⇧⏎ newline · ⌘←/→ line start/end · ⌥←/→ by word · " +
                   "⌘⌫ kill line · ⌥⌫ kill word · paste an image to send its path";
function renderKeys() {
  const box = $("keys");
  box.textContent = "";
  if (!ACTIVE) return;
  for (const [label, seq] of KEYS) {
    const b = el("button", "b", label);
    b.onclick = () => {
      const p = PANES.get(ACTIVE);
      if (p && p.ws && p.ws.readyState === 1) p.ws.send(new TextEncoder().encode(seq));
      if (p) p.term.focus();
    };
    box.append(b);
  }
}

// ---- changes ----

let CH = null, CHFILE = null, CHREV = null;

async function loadChanges(force) {
  const w = selected();
  if (!w) return;
  if (!force && CH && CH.for === SEL) return renderChanges();
  try {
    const d = await (await fetch("/api/changes?path=" + encodeURIComponent(SEL)
      + "&base=" + encodeURIComponent(w.base || ""))).json();
    CH = d; CH.for = SEL;
  } catch { CH = null; }
  renderChanges();
}

function renderChanges() {
  const bar = $("chbar"), body = $("chbody");
  bar.textContent = ""; body.textContent = "";
  const w = selected();
  if (!w) return;
  if (CHFILE || CHREV) return;              // paintDiff owns the pane
  const refresh = el("button", "b icon", "↻");
  refresh.title = "Re-read this worktree";
  refresh.onclick = () => loadChanges(true);
  bar.append(refresh);
  bar.append(el("span", "who", (CH && CH.branch) || w.branch));

  if (!CH) { body.append(el("div", "hollow", "Couldn't read this worktree.")); return; }
  const files = CH.files || [], commits = CH.commits || [];

  const section = (label, count) => {
    const h = el("div", "chsect", label);
    h.append(el("span", "count", String(count)));
    body.append(h);
  };

  section("Uncommitted", files.length);
  if (!files.length) body.append(el("div", "hollow", el("p", null, "Working tree is clean.")));
  for (const f of files) {
    const row = el("div", "chrow");
    row.setAttribute("aria-selected", f.path === CHFILE ? "true" : "false");
    row.append(el("span", "st", (f.x + f.y).trim() || "?"));
    row.append(el("span", "f", f.path));
    const n = el("span", "n");
    if (f.add) n.append(el("span", "a", "+" + f.add));
    if (f.add && f.del) n.append(document.createTextNode(" "));
    if (f.del) n.append(el("span", "d", "−" + f.del));
    row.append(n);
    row.onclick = () => showFileDiff(f);
    body.append(row);
  }

  section("Ahead of " + (CH.base || w.base || "base"), commits.length);
  if (!commits.length) {
    body.append(el("div", "hollow", el("p", null, "Nothing this base doesn't already have.")));
  }
  for (const c of commits) {
    const row = el("div", "chrow");
    row.setAttribute("aria-selected", c.sha === CHREV ? "true" : "false");
    row.append(el("code", "sha", c.sha.slice(0, 8)));
    row.append(el("span", "subject", c.msg));
    if (!c.pushed) row.append(el("span", "local", "local"));
    row.onclick = () => showCommitDiff(c);
    body.append(row);
  }
}

async function showFileDiff(f) {
  CHFILE = f.path; CHREV = null;
  renderChanges();
  let d;
  try {
    d = await (await fetch("/api/diff?path=" + encodeURIComponent(SEL)
      + "&file=" + encodeURIComponent(f.path) + (f.staged ? "&staged=1" : ""))).json();
  } catch { d = { error: "could not read the diff" }; }
  paintDiff(f.path, d.diff, d.error);
}

async function showCommitDiff(c) {
  CHREV = c.sha; CHFILE = null;
  renderChanges();
  let d;
  try {
    d = await (await fetch("/api/diff?path=" + encodeURIComponent(SEL)
      + "&rev=" + encodeURIComponent(c.sha))).json();
  } catch { d = { error: "could not read the commit" }; }
  paintDiff(c.sha + "  " + c.msg, d.diff, d.error);
}

// A diff is rendered line by line rather than as one blob so additions and
// deletions can be coloured, and so the header can stay put while you scroll.
function paintDiff(title, diff, error) {
  const bar = $("chbar"), body = $("chbody");
  bar.textContent = ""; body.textContent = "";
  const back = el("button", "b", "‹ files");
  back.onclick = () => { CHFILE = null; CHREV = null; renderChanges(); };
  bar.append(back);
  bar.append(el("span", "who", title));

  const box = el("div", "diff");
  if (error) { box.append(el("div", "hollow", el("p", null, error))); body.append(box); return; }
  if (!diff) {
    box.append(el("div", "hollow", el("p", null, "No changes in this file.")));
    body.append(box); return;
  }
  for (const line of diff.split("\n")) {
    let cls = "l";
    if (line.startsWith("@@")) cls += " hunk";
    else if (/^(\+\+\+|---|diff |index |new file|deleted file|similarity )/.test(line)) cls += " meta";
    else if (line.startsWith("+")) cls += " add";
    else if (line.startsWith("-")) cls += " del";
    box.append(el("div", cls, line || " "));
  }
  body.append(box);
}

// ---- sheets: new work, mcp, the log ----

let SHEET = null;

function openSheet(which) {
  SHEET = which;
  $("scrim").classList.add("on");
  $("sheet").classList.add("on");
  $("sbody").className = "sbody";
  if (which === "new") renderNew();
  if (which === "mcp") renderMcp(false);
  if (which === "log") renderLog();
  if (which === "keys") renderKeysSheet();
  if (which === "more") renderMore();
}
function closeSheet() {
  SHEET = null;
  $("scrim").classList.remove("on");
  $("sheet").classList.remove("on");
}

function renderNew() {
  $("stitle").textContent = "New work";
  const body = $("sbody"), foot = $("sfoot");
  body.textContent = ""; foot.textContent = "";
  // No branch name asked for: it comes from what you wrote. Needing to invent one
  // before starting is exactly the friction that stops people branching.
  const task = el("label", null, "What needs doing? The branch name comes from this.");
  const ta = el("textarea");
  ta.placeholder = "e.g. hotel search times out on long stays";
  task.append(ta);
  const nameLbl = el("label", null, "Branch name (optional)");
  const name = el("input"); name.placeholder = "derived from the task";
  nameLbl.append(name);
  const baseLbl = el("label", null, "Base branch");
  const base = el("input"); base.placeholder = (STATE && STATE.base) || "main";
  baseLbl.append(base);
  const note = el("div", "note",
    "It branches off the remote, copies the gitignored files a worktree needs, starts an agent, "
    + "and starts no containers — attach a stack later if the change turns out to need one.");
  body.append(task, nameLbl, baseLbl, note);
  // A pasted screenshot belongs here too: it's the same "here's what's wrong".
  ta.addEventListener("paste", (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    if ([...items].some(i => i.kind === "file" && (i.type || "").startsWith("image/"))) {
      e.preventDefault();
      pasteImages(items, (t) => {
        const at = ta.selectionStart || ta.value.length;
        ta.value = ta.value.slice(0, at) + t.replace(/\x1b\[20[01]~|\x16/g, "") + ta.value.slice(at);
      });
    }
  });

  const go = el("button", "b on", "Create");
  const status = el("span", "meta", "");
  go.onclick = async () => {
    go.disabled = true; status.textContent = "creating…";
    let r;
    try {
      r = await (await fetch("/api/new", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name.value, prompt: ta.value, base: base.value }) })).json();
    } catch { r = { error: "server unreachable" }; }
    go.disabled = false;
    if (r.error) { status.textContent = r.error; return; }
    closeSheet();
    SEL = r.path; CH = null;
    await poll();
    setSurface("session");
  };
  foot.append(go, status);
  setTimeout(() => ta.focus(), 30);
}

async function renderMcp(refresh) {
  $("stitle").textContent = "MCP servers";
  const body = $("sbody"), foot = $("sfoot");
  body.textContent = ""; foot.textContent = "";
  body.append(el("div", "hollow", el("p", null, "checking…")));
  let d;
  try { d = await (await fetch("/api/mcp" + (refresh ? "?refresh=1" : ""))).json(); }
  catch { d = { servers: [] }; }
  body.textContent = "";
  if (!d.enabled) {
    body.append(el("div", "hollow", el("p", null, "This project has no mcp command configured.")));
    return;
  }
  const servers = d.servers || [];
  if (!servers.length) body.append(el("div", "hollow", el("p", null,
    "No MCP servers registered. Add one below — it goes through the agent CLI.")));
  for (const x of servers) {
    const card = el("div", "srv");
    card.dataset.state = x.state;
    const nm = el("div", "nm");
    nm.append(el("i", "dot"), document.createTextNode(x.name));
    if (x.scope) nm.append(el("span", "scope", x.scope));
    card.append(nm);
    card.append(el("div", "dt", x.target || x.command || ""));
    // Registration is not reachability, so the reason goes next to the name.
    if (x.state !== "ok") card.append(el("div", "dt", x.detail || ""));
    if (x.suggest) card.append(el("div", "dt", "found at " + x.suggest + " — not on the PATH it runs with"));
    const row = el("div", "row");
    if (x.state === "auth") {
      const b = el("button", "b", "authenticate");
      b.title = "Opens an agent session and runs /mcp, where the OAuth round happens";
      b.onclick = async () => {
        closeSheet();
        await start("agent");
        setTimeout(() => sendText("/mcp\r"), 1500);
      };
      row.append(b);
    }
    const rm = el("button", "b", "remove");
    rm.onclick = async () => {
      if (!confirm("Remove MCP server " + x.name + (x.scope ? " (" + x.scope + ")" : "") + "?")) return;
      const scope = (x.scope || "").startsWith("local") ? "local" : x.scope;
      await fetch("/api/mcp/remove", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: x.name, scope }) }).catch(() => {});
      renderMcp(true);
    };
    row.append(rm);
    card.append(row);
    body.append(card);
  }

  const addBtn = el("button", "b", "＋ add a server");
  addBtn.onclick = () => renderMcpAdd();
  const refreshBtn = el("button", "b", "↻ re-check");
  refreshBtn.onclick = () => renderMcp(true);
  foot.append(addBtn, refreshBtn);
}

function renderMcpAdd() {
  const body = $("sbody"), foot = $("sfoot");
  body.textContent = ""; foot.textContent = "";
  $("stitle").textContent = "Add an MCP server";
  const f = {};
  const field = (key, label, placeholder, tag) => {
    const l = el("label", null, label);
    const i = el(tag || "input");
    i.placeholder = placeholder || "";
    l.append(i); body.append(l); f[key] = i;
  };
  field("name", "Name", "grafana");
  field("target", "URL, or the command to run", "https://mcp.example.com or mcp-grafana --flag");
  const tl = el("label", null, "Transport");
  const t = el("select");
  for (const v of ["stdio", "http", "sse"]) t.append(el("option", null, v));
  tl.append(t); body.append(tl); f.transport = t;
  const sl = el("label", null, "Scope — who sees it");
  const sc = el("select");
  for (const v of ["user", "project", "local"]) sc.append(el("option", null, v));
  sl.append(sc); body.append(sl); f.scope = sc;
  field("env", "Environment, one KEY=value per line", "TOKEN=…", "textarea");
  field("headers", "Headers, one Name: value per line", "Authorization: Bearer …", "textarea");
  body.append(el("div", "note",
    "This shells out to the agent CLI, so the CLI stays the source of truth for what's registered."));

  const save = el("button", "b on", "Add");
  const status = el("span", "meta", "");
  save.onclick = async () => {
    save.disabled = true; status.textContent = "adding…";
    const lines = (v) => v.split("\n").map(x => x.trim()).filter(Boolean);
    let r;
    try {
      r = await (await fetch("/api/mcp/add", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: f.name.value, target: f.target.value,
          transport: f.transport.value, scope: f.scope.value,
          env: lines(f.env.value), headers: lines(f.headers.value) }) })).json();
    } catch { r = { error: "server unreachable" }; }
    save.disabled = false;
    if (r.error) { status.textContent = r.error; return; }
    renderMcp(true);
  };
  const back = el("button", "b", "‹ back");
  back.onclick = () => renderMcp(false);
  foot.append(save, back, status);
}

let LOG_BAD_ONLY = false;
async function renderLog() {
  $("stitle").textContent = "Server log";
  const body = $("sbody"), foot = $("sfoot");
  body.className = "sbody log";
  body.textContent = ""; foot.textContent = "";
  let d;
  try { d = await (await fetch("/api/log")).json(); } catch { d = { lines: [] }; }
  const lines = (d.lines || []).filter(l => !LOG_BAD_ONLY || l.level !== "info");
  if (!lines.length) {
    body.append(el("div", "hollow",
      el("p", null, LOG_BAD_ONLY ? "No problems logged." :
        "Nothing yet. Sessions, new work, stack actions and any command that fails land here.")));
  }
  for (const l of lines) {
    const row = el("div", "logline " + l.level);
    row.append(el("span", "t", l.at), el("span", "m", l.msg));
    body.append(row);
  }
  const only = el("button", "b" + (LOG_BAD_ONLY ? " on" : ""), "Problems only");
  only.onclick = () => { LOG_BAD_ONLY = !LOG_BAD_ONLY; renderLog(); };
  const again = el("button", "b icon", "↻");
  again.onclick = renderLog;
  foot.append(only, again);
  body.scrollTop = body.scrollHeight;
}

// On a phone the header has room for one action, so the rest live here.
function renderMore() {
  $("stitle").textContent = "workmux";
  const body = $("sbody"), foot = $("sfoot");
  body.className = "sbody"; body.textContent = ""; foot.textContent = "";
  const items = [
    ["MCP servers", "Which servers an agent can reach", () => openSheet("mcp")],
    ["Server log", "What this instance has been doing", () => openSheet("log")],
    ["Keyboard", "Chords a phone keyboard can't type", () => openSheet("keys")],
  ];
  for (const [label, what, fn] of items) {
    const row = el("div", "chrow");
    row.append(el("span", "subject", label), el("span", "n", what));
    row.onclick = fn;
    body.append(row);
  }
}

// The chords, on request rather than dumped into an empty pane.
function renderKeysSheet() {
  $("stitle").textContent = "Keyboard";
  const body = $("sbody"), foot = $("sfoot");
  body.className = "sbody"; body.textContent = ""; foot.textContent = "";
  const rows = [
    ["⌘⏎ / ⇧⏎", "New line, without submitting"],
    ["⌘← / ⌘→", "Start and end of the line"],
    ["⌥← / ⌥→", "A word at a time"],
    ["⌘⌫ / ⌥⌫", "Kill the line, kill a word"],
    ["⌘N", "New work"],
    ["Esc", "Close this"],
    ["⌃C / ⌃D", "Interrupt, end of input — sent to the program, not the browser"],
    ["Paste an image", "Goes to the agent through your clipboard"],
  ];
  for (const [k, what] of rows) {
    const r = el("div", "chrow");
    r.style.cursor = "default";
    r.append(el("code", "sha", k), el("span", "subject", what));
    r.querySelector(".sha").style.flex = "0 0 11ch";
    body.append(r);
  }
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && SHEET) { closeSheet(); return; }
  // ⌘N for new work, the one thing you start from anywhere. Not while typing in a
  // terminal, which owns its keystrokes.
  if ((e.metaKey || e.ctrlKey) && e.key === "n") { e.preventDefault(); openSheet("new"); }
});

function setSurface(which) {
  $("main").dataset.surface = which;
  for (const [id, key] of [["nav-work","work"],["nav-session","session"],["nav-changes","changes"]]) {
    $(id).setAttribute("aria-current", which === key ? "true" : "false");
  }
  if (which === "changes") loadChanges(false);
  const p = PANES.get(ACTIVE);
  if (which === "session" && p) { p.fit.fit(); p.term.focus(); }
}

// Refit on rotate, on window changes, and when a phone keyboard appears — that
// changes the visible height without firing a window resize on iOS.
const refit = () => { const p = PANES.get(ACTIVE); if (p) p.fit.fit(); };
window.addEventListener("resize", refit);
if (window.visualViewport) window.visualViewport.addEventListener("resize", refit);

poll();
setInterval(poll, 4000);
</script>
