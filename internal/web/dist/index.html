<script src="/vendor/ghostty-web.js"></script>
<script>
// Plain DOM on purpose, for now: this is being replaced by a TS build that a mobile
// app will load as well, and porting the same logic twice is how details get lost.
const el = (t, c, ...kids) => {
  const n = document.createElement(t);
  if (c) n.className = c;
  for (const k of kids) if (k != null) n.append(k);   // strings or nodes, both appended
  return n;
};
const $ = (id) => document.getElementById(id);

let STATE = null, WORK = [], SEL = null, SESSIONS = [], ACTIVE = null, FILTER = "";
const PANES = new Map();   // session id → {term, fit, ws, dead}

// ---- work ----

let POLLING = 0;
// The bar is for things you asked for. A background poll that draws a progress bar
// every few seconds is just flicker, and it made the page look like it was reloading.
function loading(on) {
  POLLING = Math.max(0, POLLING + (on ? 1 : -1));
  const bar = $("loading");
  if (POLLING > 0) {
    bar.classList.add("on");
    bar.style.width = "70%";       // creeps; it doesn't pretend to know how long
  } else {
    bar.style.width = "100%";
    setTimeout(() => { if (POLLING === 0) { bar.classList.remove("on"); bar.style.width = "0"; } }, 200);
  }
}

// What the page actually draws. If this is unchanged there is nothing to redraw, and
// rebuilding anyway is what threw away your scroll position and hover every few
// seconds.
function signature(d) {
  return JSON.stringify([
    d.name, d.base, d.next_slot, d.stack_enabled, d.terminal,
    (d.work || []).map(w => [w.path, w.branch, w.tempo, w.live, w.behind, w.ahead, w.rank,
      w.prs, w.stack && [w.stack.slot, w.stack.up, w.stack.total],
      (w.agents || []).map(a => [a.id, a.name, a.tempo, a.detail]),
      (w.sessions || []).map(s => [s.id, s.alive])]),
  ]);
}

let SIG = null;

async function poll(userAsked) {
  // Don't redraw underneath an open menu or sheet: the anchor vanishes mid-click.
  if (!userAsked && (MENU || SHEET)) return;
  let d;
  if (userAsked) loading(true);
  try { d = await (await fetch("/api/work")).json(); }
  catch {
    // Keep the last picture. A blank dashboard is indistinguishable from a broken one,
    // and a briefly unreachable server is the common case, not a crash.
    $("stats").textContent = "reconnecting…";
    if (userAsked) loading(false);
    return;
  }
  STATE = d; WORK = d.work || [];
  // One instance per project is the normal case, so the tab has to say which. The
  // project comes first because titles truncate from the right.
  document.title = d.name ? d.name + " · workmux" : "workmux";
  $("proj").textContent = d.name || "workmux";
  const stats = $("stats");
  stats.textContent = "";
  const chip = (t) => stats.append(el("span", null, t));
  const wants = WORK.filter(w => w.tempo === "blocked").length;
  const live = WORK.filter(w => w.live).length;
  chip(WORK.length + " trees");
  if (wants) chip(wants + " waiting");
  if (live) chip(live + " working");
  chip(d.base);
  if (d.stack_enabled) chip("next " + d.next_slot);
  // The page you are looking at keeps running the JS it loaded. After an upgrade or a
  // restart that JS can be older than the server, and then you're debugging a bug that
  // was fixed an hour ago — so say so instead of letting it happen quietly.
  if (d.build) {
    if (!BUILD) BUILD = d.build;
    else if (BUILD !== d.build) staleNotice();
  }
  $("btn-mcp").hidden = !(d.agent && d.agent.mcp);
  if (!SEL || !WORK.some(w => w.path === SEL)) SEL = (WORK[0] || {}).path || null;
  const sig = signature(d);
  const changed = sig !== SIG;
  SIG = sig;
  if (changed) {
    // The list scrolls, and rebuilding it would jump you back to the top.
    const list = $("list"), top = list.scrollTop;
    renderWork();
    list.scrollTop = top;
  }
  await refreshSessions(!changed);
  // Diffs are only re-read when you're looking at them, or when the work changed.
  const wantChanges = $("main").dataset.surface === "changes";
  if (!CH || CH.for !== SEL) await loadChanges(true, userAsked);
  else if (wantChanges && changed) await loadChanges(true, false);
  if (changed || userAsked) { if (wantChanges) renderChanges(); else renderBar(); }
  // A session that exists should be on screen, including on the very first paint. A
  // poll never starts one: that's a click's decision, not a timer's.
  if (!ACTIVE) showWork(false);
  if (userAsked) loading(false);
}

// Bands make the server's ordering visible. It already sorts by what wants you, but
// a flat list of identical cards hides that entirely — which is the difference
// between a list you read and a list you scan.
const BANDS = [
  { key:"wants", label:"Wants you",  tone:"wants", has:(w) => w.tempo === "blocked" },
  { key:"live",  label:"Working",    tone:"live",  has:(w) => w.live || w.tempo === "active" },
  { key:"up",    label:"App running",tone:"up",    has:(w) => !!w.stack },
  { key:"rest",  label:"Quiet",      tone:"idle",  has:() => true },
  { key:"base",  label:"Base checkout", tone:"base", has:() => false },
];

// What the filter matches: the branch, what the agent last said, its name, and the PR
// numbers. All four are things you'd type looking for a piece of work.
function matches(w, q) {
  if (!q) return true;
  const hay = [w.branch, w.base, (w.agents || []).map(a => (a.name || "") + " " + (a.detail || "")).join(" "),
               (w.prs || []).map(n => "#" + n).join(" "), w.stack ? w.stack.slot : ""].join(" ").toLowerCase();
  // Every word has to appear, so a second word narrows instead of widening.
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(t => hay.includes(t));
}

function renderWork() {
  const list = $("list");
  list.textContent = "";
  if (!WORK.length) {
    list.append(el("div", "hollow", "No worktrees yet."));
    return;
  }
  const q = FILTER.trim();
  const shown = WORK.filter(w => matches(w, q));
  if (!shown.length) {
    list.append(el("div", "hollow", el("h3", null, "Nothing matches “" + q + "”."),
                                    el("p", null, String(WORK.length) + " worktrees are hidden.")));
    return;
  }
  const taken = new Set();
  for (const band of BANDS) {
    const rows = shown.filter(w => {
      if (taken.has(w.path)) return false;
      const mine = band.key === "base" ? w.is_default : (!w.is_default && band.has(w));
      if (mine) taken.add(w.path);
      return mine;
    });
    if (!rows.length) continue;
    const sec = el("section", "band");
    sec.dataset.tone = band.tone;
    const h = el("h2", null, band.label);
    h.append(el("span", "count", String(rows.length)));
    sec.append(h);
    for (const w of rows) sec.append(strip(w, band.tone));
    list.append(sec);
  }
}

function strip(w, tone) {
  const row = el("article", "strip");
  row.dataset.tone = tone;
  row.setAttribute("aria-selected", w.path === SEL ? "true" : "false");
  row.append(el("i", "rail"));
  const body = el("div", "body");
  // The branch is the only name here that holds still. Everything else on this card is
  // the agent talking about itself, and it renames itself as the work moves — which is
  // no way to find the one you were in an hour ago. So the card also says when that was.
  const head = el("div", "head");
  head.append(el("div", "branch", w.branch));
  const seen = SEEN[w.path];
  if (seen) {
    const last = w.path === latestSeen();
    head.append(el("span", "seen" + (last ? " last" : ""), last ? "last here" : ago(seen)));
  }
  body.append(head);

  // What it last said, in its own words. This is the line you actually read.
  const agent = (w.agents || [])[0];
  if (agent) {
    const said = (agent.detail || agent.name || "").trim();
    if (said) body.append(el("div", "said", said));
  } else if (w.is_default) {
    body.append(el("div", "said", "where you're standing — not a change in flight"));
  }

  const chips = el("div", "chips");
  const add = (cls, text, dot) => {
    const c = el("span", "chip " + cls);
    if (dot) c.append(el("i", "dot"));
    c.append(document.createTextNode(text));
    chips.append(c);
  };
  if (w.tempo === "blocked") add("state", "needs you", true);
  else if (w.live) add("state", agent ? (agent.name || "working") : "working", true);
  if (w.stack) add("app", w.stack.slot + " " + w.stack.up + "/" + w.stack.total, true);
  for (const n of (w.prs || []).slice(0, 3)) add("pr", "#" + n);
  if (w.behind > 0) add("", "⇣" + w.behind);
  if (w.ahead > 0) add("", "⇡" + w.ahead);
  if (chips.children.length) body.append(chips);

  row.append(body);
  row.onclick = () => {
    SEL = w.path; ACTIVE = null; CHFILE = null; CHREV = null;
    markSeen(w.path);
    renderWork();
    setSurface("session");
    showWork(true);              // its session, not an empty pane
    loadChanges(true);
  };
  return row;
}

const selected = () => WORK.find(w => w.path === SEL) || null;

// Which worktrees you have actually been in, and when. The browser remembers this rather
// than the server: it's a fact about you, not about the repo, and the answer it gives is
// the one the names can't — "this is the one you were in before".
const SEEN_KEY = "workmux.seen";
const LAST_KEY = "workmux.last";
let SEEN = {}, LAST = {};
try { SEEN = JSON.parse(localStorage.getItem(SEEN_KEY) || "{}") || {}; } catch { SEEN = {}; }
try { LAST = JSON.parse(localStorage.getItem(LAST_KEY) || "{}") || {}; } catch { LAST = {}; }

// Which session you were last in, per worktree. Ids only mean anything to the server
// that issued them, so a stale one simply doesn't match anything alive and is ignored.
function markSession(path, id) {
  if (!path || !id) return;
  LAST[path] = id;
  try { localStorage.setItem(LAST_KEY, JSON.stringify(LAST)); } catch {}
}

function markSeen(path) {
  if (!path) return;
  SEEN[path] = Date.now();
  // Bounded: a worktree that no longer exists is a row nobody will ever read again.
  const live = new Set(WORK.map(w => w.path));
  for (const p of Object.keys(SEEN)) if (!live.has(p) && WORK.length) delete SEEN[p];
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(SEEN)); } catch {}
}

function latestSeen() {
  let best = null;
  for (const [p, t] of Object.entries(SEEN)) if (!best || t > SEEN[best]) best = p;
  return best;
}

function ago(ms) {
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 90) return "just now";
  const m = s / 60;
  if (m < 60) return Math.round(m) + "m ago";
  const h = m / 60;
  if (h < 24) return Math.round(h) + "h ago";
  const d = Math.round(h / 24);
  return d === 1 ? "yesterday" : d + "d ago";
}

// The session to show for a piece of work: the one you were last in, then the agent,
// then whatever is open. Switching work used to land on "pick a session" even when that
// work had exactly one — and then, once it stopped doing that, on the first session
// every time, so a second session was something you had to re-find on every switch.
function sessionFor(path) {
  const mine = SESSIONS.filter(s => s.cwd === path && s.alive);
  const last = mine.find(s => s.id === LAST[path]);
  // The agent next, then the newest thing you opened — ids ascend, so that's the last.
  return last || mine.find(s => s.kind === "attach") ||
         mine.slice().sort((a, b) => cmpId(b.id, a.id))[0] || null;
}

// s2 vs s10: compare the number, not the string.
function cmpId(a, b) {
  const n = (x) => parseInt(String(x).replace(/\D/g, ""), 10) || 0;
  return n(a) - n(b);
}

// Show that session. With nothing open but an agent living there, resume it rather
// than showing a chooser — that's the session for this piece of work.
let AUTO = null;                       // don't try to auto-start the same work twice
function showWork(mayStart) {
  const s = sessionFor(SEL);
  if (s) { if (s.id !== ACTIVE) open(s.id); return; }
  ACTIVE = null;
  renderBar();
  const w = selected();
  const caps = (STATE && STATE.agent) || {};
  if (mayStart && w && w.agents && w.agents.length && caps.attach && AUTO !== SEL) {
    AUTO = SEL;
    start("resume");
  }
}

// ---- sessions ----

let SESSIG = null;
async function refreshSessions(quiet) {
  let list = [], answered = true;
  try {
    const d = await (await fetch("/api/session/list")).json();
    list = d.sessions || [];
  } catch { list = []; answered = false; }   // --no-terminal: the route isn't there at all
  if (answered) forgetVanished(list);
  const sig = JSON.stringify(list.map(s => [s.id, s.title, s.alive, s.cwd]));
  const changed = sig !== SESSIG;
  SESSIG = sig;
  SESSIONS = list;
  if (changed || !quiet) renderBar();
}

// A restarted server has no memory of the sessions it was running: their ids belong to
// nothing now, and a pane holding one would retry forever against a session that cannot
// come back. When the server has answered and an id isn't in the answer, the pane goes,
// and the surface shows what does exist instead of a dead terminal.
function forgetVanished(list) {
  const live = new Set(list.map(s => s.id));
  let lostActive = false;
  for (const [id, pane] of [...PANES]) {
    if (live.has(id)) continue;
    pane.exited = true;
    clearTimeout(pane.retryTimer);
    if (pane.ws) { try { pane.ws.close(); } catch {} }
    pane.wrap.remove();
    pane.term.dispose();
    PANES.delete(id);
    if (ACTIVE === id) { ACTIVE = null; lostActive = true; }
  }
  if (lostActive) showWork(false);
}

// One switch, rendered into whichever toolbar is showing, so it never moves.
function tabs(active) {
  const seg = el("div", "seg");
  const w = selected();
  const mine = SESSIONS.filter(s => s.cwd === SEL && s.alive);

  // Session is a menu: the agent is the default, and everything else a session can be
  // lives behind the caret rather than as four more buttons in the row.
  //
  // The tab is named after the session you are in, not numbered. "Session 3" is an
  // ordinal for something that has a name, and with two agents running it told you
  // nothing about which one you were looking at — or which was waiting on you.
  const cur = mine.find(s => s.id === ACTIVE);
  const sess = el("button", null);
  sess.setAttribute("aria-current", active === "session" ? "true" : "false");
  if (cur && sessionWaiting(cur, w)) sess.append(el("i", "dot wants"));
  sess.append(el("span", "lbl", cur ? sessionLabel(cur, w) : "Session"));
  if (cur && !cur.alive) sess.append(el("span", "n", "ended"));
  else if (!cur && mine.length) sess.append(el("span", "n", String(mine.length)));
  // Another one is waiting on you, and it's behind the caret.
  if (mine.some(s => s !== cur && sessionWaiting(s, w))) sess.append(el("i", "dot wants other"));
  sess.append(el("span", "caret", "▾"));
  // The label goes there, the caret opens the menu. Making the label do both meant
  // clicking a tab to get back to your terminal popped a menu you didn't ask for.
  sess.lastChild.onclick = (e) => { e.stopPropagation(); sessionMenu(sess, w, mine); };
  sess.onclick = () => setSurface("session");
  seg.append(sess);

  // Shell is one click, because it's the one you want without thinking.
  const sh = el("button", null, "Shell");
  const openShell = mine.find(s => s.kind === "shell");
  sh.setAttribute("aria-current", (active === "session" && openShell && openShell.id === ACTIVE) ? "true" : "false");
  sh.onclick = () => openShell ? open(openShell.id) : start("shell");
  seg.append(sh);

  // Git *is* the changes surface. They were two controls for one idea: a tab that
  // shows the diff, and a button whose menu acted on the same branch.
  const git = el("button", null, "Git");
  git.setAttribute("aria-current", active === "changes" ? "true" : "false");
  const n = CH && CH.for === SEL ? (CH.files || []).length : 0;
  if (n) git.append(el("span", "n", String(n)));
  if (w && w.behind > 0) git.append(el("span", "n", "⇣" + w.behind));
  const caret = el("span", "caret", "▾");
  caret.onclick = (e) => { e.stopPropagation(); gitMenu(git, w); };
  git.append(caret);
  git.onclick = () => {
    // Already looking at a diff? The tab is how you get back to the list.
    if ($("main").dataset.surface === "changes" && (CHFILE || CHREV)) {
      CHFILE = null; CHREV = null;
      renderChanges();
      return;
    }
    setSurface("changes");
  };
  seg.append(git);
  return seg;
}

// ---- menus ----

let MENU = null;
function closeMenu() { if (MENU) { MENU.remove(); MENU = null; } }
document.addEventListener("click", (e) => {
  if (MENU && !MENU.contains(e.target) && !e.target.closest(".seg button, [data-menu]")) closeMenu();
}, true);

function menu(anchor, items) {
  closeMenu();
  const m = el("div", "popover");
  for (const it of items) {
    if (it.sep) { m.append(el("div", "msep")); continue; }
    const row = el("button", "mrow" + (it.danger ? " danger" : "") + (it.on ? " on" : "") +
                              (it.wants ? " wants" : ""));
    row.append(el("span", "ml", it.label));
    if (it.hint) row.append(el("span", "mh", it.hint));
    row.disabled = !!it.disabled;
    row.onclick = () => { closeMenu(); it.go && it.go(); };
    m.append(row);
  }
  document.body.append(m);
  const r = anchor.getBoundingClientRect();
  m.style.top = Math.round(r.bottom + 4) + "px";
  m.style.left = Math.round(Math.min(r.left, window.innerWidth - m.offsetWidth - 8)) + "px";
  MENU = m;
}

function sessionMenu(anchor, w, mine) {
  if (!w) return;
  const caps = STATE.agent || {};
  const items = [];
  for (const s of mine) {
    items.push({
      label: sessionLabel(s, w),
      hint: sessionWaiting(s, w) ? "needs you" : (s.id === ACTIVE ? "open" : ""),
      wants: sessionWaiting(s, w),
      on: s.id === ACTIVE,
      go: () => open(s.id),
    });
  }
  if (mine.length) items.push({ sep: true });
  const attached = mine.some(s => s.kind === "attach");
  if (w.agents.length && caps.attach && !attached) {
    items.push({ label: "Resume " + (w.agents[0].name || "the agent"), hint: "⌥R", go: () => start("resume") });
  } else if (!w.agents.length && caps.run) {
    items.push({ label: "Start " + (caps.name || "an agent"), go: () => start("agent") });
  }
  // Nothing here that already has a control of its own: Shell is a tab, git is the
  // Git menu, container logs sit with the containers. A second door to the same room
  // is just another thing to read.
  if (ACTIVE) {
    items.push({ sep: true });
    items.push({ label: "Close this session", danger: true, go: () => kill(ACTIVE) });
  }
  menu(anchor, items);
}

// Git is a menu too, because "merge main" alone was the only git verb on offer and it
// isn't the only one you want.
function gitMenu(anchor, w) {
  const items = [];
  const behind = w.behind > 0, ahead = w.ahead > 0;
  items.push({
    label: behind ? "Merge " + w.base + " in" : "Up to date with " + w.base,
    hint: behind ? "⇣" + w.behind : "", disabled: !behind, go: () => mergeBase(w),
  });
  items.push({ label: "Fetch " + w.base, hint: "check for new commits", go: () => refreshDrift(w) });
  items.push({ sep: true });
  items.push({ label: "Open a git session", hint: "lazygit", go: () => start("git") });
  if ((w.prs || []).length && STATE.repo_url) {
    items.push({ sep: true });
    for (const n of w.prs.slice(0, 4)) {
      items.push({ label: "Pull request #" + n, hint: "github",
                   go: () => window.open(STATE.repo_url + "/pull/" + n, "_blank") });
    }
  }
  menu(anchor, items);
}

async function mergeBase(w) {
  toast("Merging " + w.base + " into " + w.branch + "…");
  let r;
  try {
    r = await (await fetch("/api/update", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: SEL, base: w.base }) })).json();
  } catch { r = { error: "server unreachable" }; }
  toast(r.error ? r.error : "Merged " + w.base + " in");
  poll(); loadChanges(true);
}

async function refreshDrift(w) {
  toast("Fetching " + w.base + "…");
  await poll();
  const now = WORK.find(x => x.path === SEL) || w;
  toast(now.behind > 0 ? now.behind + " commits behind " + now.base : "Up to date with " + now.base);
}

function renderBar() {
  const bar = $("bar");
  bar.textContent = "";
  if (!STATE) return;
  bar.append(tabs("session"));
  if (STATE.terminal === false) {
    bar.append(el("span", "who", "Terminals are off — started with --no-terminal."));
    return;
  }
  const w = selected();
  if (!w) return;
  const caps = STATE.agent || {};
  const mine = SESSIONS.filter(s => s.cwd === SEL);
  const group = () => { const g = el("div", "group"); bar.append(g); return g; };
  const btn = (into, label, fn, opts) => {
    const b = el("button", "b" + (opts && opts.cls ? " " + opts.cls : ""), label);
    b.onclick = fn;
    if (opts && opts.title) b.title = opts.title;
    into.append(b);
    return b;
  };

  // Then the app, then the branch. Grouped, so a destructive button never sits next
  // to the one you press all the time.
  if (STATE.stack_enabled) {
    const g3 = group();
    if (w.stack) {
      if (w.stack.url) btn(g3, "↗ open", () => window.open(w.stack.url, "_blank"),
                           { title: w.stack.url });
      btn(g3, "Logs", () => start("logs"), { title: "Tail " + w.stack.slot + "'s containers" });
      btn(g3, "↻ restart", () => stackAction("restart", w));
      btn(g3, "■ stop", () => stackAction("stop", w), { cls: "danger" });
    } else {
      btn(g3, "▶ start app", () => stackAction("up", w),
          { title: "Containers for this work — it doesn't need them to exist" });
    }
  }
  if (ACTIVE) {
    const g5 = group();
    btn(g5, "⤢", toggleFull, { cls: "icon", title: "Whole window" });
    btn(g5, "A−", () => setFont(-1), { cls: "icon", title: "Smaller text" });
    btn(g5, "A+", () => setFont(1), { cls: "icon", title: "Bigger text" });
  }
  if (!ACTIVE) showEmpty(mine.length);
}

// What to call a session. An attach is the agent, so it's named after the agent —
// "claude 2b4d5fff" is an id, and an id is not a name.
function sessionLabel(s, w) {
  if (s.kind === "attach") {
    const a = (w.agents || []).find(a => a.id === s.agent);
    if (a && a.name) return a.name;
    return (STATE.agent && STATE.agent.name) || "agent";
  }
  return s.title || s.kind;
}

// Whether this session is the one waiting on you. An attach is an agent, and the agent
// says so itself; anything else is a shell, and a shell waits on you by definition.
function sessionWaiting(s, w) {
  if (!s || s.kind !== "attach" || !w) return false;
  const a = (w.agents || []).find(x => x.id === s.agent);
  return (a ? a.tempo : w.tempo) === "blocked";
}

async function stackAction(action, w) {
  const slot = w.stack ? w.stack.slot : (STATE.next_slot || "");
  toast(action === "up" ? "Starting " + slot + "…" : action + "ing " + slot + "…");
  let r;
  try {
    r = await (await fetch("/api/stack", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action, slot, path: SEL }) })).json();
  } catch { r = { error: "server unreachable" }; }
  if (r.error) toast(r.error);
  else toast(action === "stop" ? slot + " stopped" : slot + " " + (action === "up" ? "started" : "restarted"));
  poll();
}

function showEmpty(existing) {
  const t = $("term");
  hideHollow();
  for (const p of PANES.values()) p.wrap.classList.remove("on");
  const w = selected();
  const box = el("div", "hollow");
  if (existing) {
    box.append(el("h3", null, "Pick a session above."));
    t.append(box);
    return;
  }
  box.append(el("h3", null, w ? w.branch : "Nothing selected"));
  box.append(el("p", null, (w && w.agents && w.agents.length)
    ? "Resume the agent to take over its session, or open a shell."
    : "Start the agent, a shell, or a git view. Sessions live in the server, so a reload reattaches."));
  // Facts about this work, so the pane says something while it's idle.
  if (w) {
    const facts = el("dl", "facts");
    const fact = (k, v) => { facts.append(el("dt", null, k)); facts.append(el("dd", null, v)); };
    fact("branch", w.branch);
    fact("base", w.base + (w.behind > 0 ? "  ⇣" + w.behind : "") + (w.ahead > 0 ? "  ⇡" + w.ahead : ""));
    for (const a of w.agents || []) fact("agent", (a.name || a.id) + (a.tempo ? "  " + a.tempo : ""));
    if (w.stack) fact("app", w.stack.slot + "  " + w.stack.up + "/" + w.stack.total + " up");
    else if (STATE && STATE.stack_enabled) fact("app", "not running");
    if ((w.prs || []).length) fact("prs", w.prs.map(n => "#" + n).join("  "));
    fact("path", w.path.replace(/^.*\/(?=[^/]+\/[^/]+$)/, "…/"));
    box.append(facts);
  }
  t.append(box);
}

async function start(kind) {
  const size = fitSize();
  let r;
  try {
    r = await (await fetch("/api/session/new", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ kind, cwd: SEL, cols: size.cols, rows: size.rows }),
    })).json();
  } catch { return; }
  if (r.error) {
    const t = $("term"); t.textContent = ""; t.append(el("div", "empty", r.error));
    return;
  }
  await refreshSessions();
  open(r.id);
}

async function kill(id) {
  // Gone from the row immediately. Waiting for the next poll to agree left a tab you
  // had just closed sitting there, which reads as the close not working.
  const p = PANES.get(id);
  if (p) {
    p.exited = true;
    clearTimeout(p.retryTimer);
    if (p.ws) { try { p.ws.close(); } catch {} }
    p.wrap.remove(); p.term.dispose(); PANES.delete(id);
  }
  SESSIONS = SESSIONS.filter(s => s.id !== id);
  if (ACTIVE === id) ACTIVE = null;
  renderBar();
  await fetch("/api/session/kill", { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id }) }).catch(() => {});
  await refreshSessions();
}

// open shows a pane, creating it once. Its element is never destroyed and the
// Terminal is never re-opened: both of those leave the renderer attached to
// a node that is no longer in the document, which is a pane that paints nothing.
async function open(id) {
  ACTIVE = id;
  markSeen(SEL);
  markSession(SEL, id);
  setSurface("session");
  const box = $("term");
  hideHollow();
  let pane = PANES.get(id);
  if (!pane) {
    const wrap = el("div", "wrap");
    wrap.dataset.session = id;
    box.append(wrap);
    const term = new GhosttyWeb.Terminal({
      fontSize: FONT, lineHeight: 1.25,
      fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
      cursorBlink: true, scrollback: 8000,
      // ⌥ must reach the program as a meta prefix, or word-wise editing does nothing.
      macOptionIsMeta: true, allowProposedApi: true,
      theme: { background: "#0e0e13", foreground: "#e7e7ee", cursor: "#e7e7ee",
               selectionBackground: "#2b3a55" },
    });
    const fit = new GhosttyWeb.FitAddon();
    term.loadAddon(fit);
    pane = { term, fit, ws: null, dead: false, wrap, wired: false, at: null };
    PANES.set(id, pane);
    wirePane(id, pane);
    // macOS line-editing habits the browser swallows before the terminal sees them, mapped
    // to the control codes a readline or TUI actually listens for. Without these,
    // ⌘⏎ submits instead of adding a newline and ⌘← does nothing at all.
    const CHORDS = [
      [e => e.metaKey && e.key === "Enter", "\x1b\r"],      // newline, don't submit
      [e => e.shiftKey && e.key === "Enter", "\x1b\r"],     // same, for a phone
      // Ghostty sends a plain tab for ⇧⇥, the same byte as ⇥ — so a program that cycles
      // a mode on back-tab never heard about it, and got a completion request instead.
      [e => e.shiftKey && e.key === "Tab", "\x1b[Z"],       // back-tab
      [e => e.metaKey && e.key === "ArrowLeft", "\x01"],     // start of line (⌃A)
      [e => e.metaKey && e.key === "ArrowRight", "\x05"],    // end of line (⌃E)
      [e => e.metaKey && e.key === "Backspace", "\x15"],     // kill to start (⌃U)
      [e => e.altKey && e.key === "ArrowLeft", "\x1bb"],     // word left
      [e => e.altKey && e.key === "ArrowRight", "\x1bf"],    // word right
      [e => e.altKey && e.key === "Backspace", "\x1b\x7f"], // kill word
    ];
    // The return value means the opposite of what xterm's did: here true says "I have
    // handled this key, stop", and false says "you encode it". An xterm-compatible API
    // is not an identical one, and returning xterm's `true` for every key swallowed
    // every keystroke — the terminal painted, the prompt was there, and nothing typed
    // arrived. ⌘V and ⌘C are left alone by the terminal itself, so the browser keeps them.
    term.attachCustomKeyEventHandler((e) => {
      if (e.type !== "keydown") return false;
      for (const [match, bytes] of CHORDS) {
        if (match(e)) {
          send(pane, new TextEncoder().encode(bytes));
          return true;
        }
      }
      return false;
    });
  }
  for (const [pid, p] of PANES) p.wrap.classList.toggle("on", pid === id);
  if (!pane.opened) {
    pane.opened = true;
    await VT_READY;
    pane.term.open(pane.wrap);
  }
  // Two frames: the wrapper has just become visible, and fitting against a box that
  // is still zero-sized is how a session ends up 80×24 inside a wide window.
  await twoFrames();
  try { pane.fit.fit(); } catch {}
  // Fit before attaching, not after. The attach carries the size in its query string, so
  // attaching first told the server the size the pane used to be — and the server decides
  // from that whether its buffer can be replayed into this terminal at all.
  if (!pane.ws || pane.ws.readyState > 1) connect(id, pane);
  focusPane(pane);
  renderBar();
  renderKeys();
}

const twoFrames = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

// Focus, and mean it. term.focus() is a no-op while the element is still being laid out,
// and a pane you cannot type into until you switch away and back is indistinguishable
// from a broken session.
function focusPane(pane) {
  const tryIt = () => {
    if (!pane.wrap.isConnected || !pane.wrap.classList.contains("on")) return true;
    pane.term.focus();
    return pane.wrap.contains(document.activeElement) || document.activeElement === pane.wrap;
  };
  if (tryIt()) return;
  let n = 0;
  const timer = setInterval(() => { if (tryIt() || ++n > 20) clearInterval(timer); }, 50);
}

// What the visible terminal says, for tests and for debugging by hand. A canvas has no
// text to read, so it comes from the terminal's own buffer — cell by cell, rather than
// by selecting everything and copying it: that answered "" until the renderer had
// settled, and it threw away whatever you had selected on the way past.
function screenText(id) {
  const p = PANES.get(id || ACTIVE);
  if (!p) return "";
  const buf = p.term.buffer && p.term.buffer.active;
  if (!buf) return "";
  const out = [];
  for (let y = 0; y < p.term.rows; y++) {
    const line = buf.getLine(y);
    if (!line) continue;
    let s = "";
    for (let x = 0; x < line.length; x++) {
      const cell = line.getCell(x);
      const code = cell ? cell.getCodepoint() : 0;
      s += code ? String.fromCodePoint(code) : " ";
    }
    out.push(s.replace(/\s+$/, ""));
  }
  return out.join("\n").replace(/\n+$/, "");
}

// The empty state is a sibling of the panes, not a replacement for them.
function hideHollow() { const h = $("term").querySelector(".hollow"); if (h) h.remove(); }

// ---- the mouse ------------------------------------------------------------
//
// A full-screen program asks for the mouse (DECSET 1000/1002/1003, SGR encoding with
// 1006) and from then on it owns it: the wheel scrolls *its* transcript, a click hits
// whatever it drew there. ghostty-web implements no reporting side at all, and instead
// substitutes arrow keys for the wheel whenever the alternate screen is up — so
// scrolling an agent's output typed Up-arrow into its prompt, four per notch, and no
// click ever reached the program. Both of those are this, and the modes are read from
// the program's own output because nothing else knows them.
// Ghostty's own parser already knows which modes are set, so ask it rather than
// re-reading the byte stream on the way past: a second parser would have to be taught
// about escapes split across two frames, resets, and the alternate screen, and would
// disagree with the renderer the first time it got one of them wrong.
function tracking(pane) {
  try {
    if (!pane.term.hasMouseTracking()) return 0;
    return pane.term.getMode(1003) ? 1003 : pane.term.getMode(1002) ? 1002 : 1000;
  } catch { return 0; }
}

function sgrMouse(pane) {
  try { return pane.term.getMode(1006); } catch { return false; }
}

function paneAt(e) {
  const wrap = e.target.closest && e.target.closest(".wrap");
  return wrap ? PANES.get(wrap.dataset.session) : null;
}

// 1-based, the way the protocol counts.
function cellAt(pane, e) {
  const cv = pane.wrap.querySelector("canvas");
  if (!cv) return null;
  const r = cv.getBoundingClientRect();
  const clamp = (v, hi) => Math.min(Math.max(v, 1), hi);
  return {
    col: clamp(Math.floor((e.clientX - r.left) / (r.width / pane.term.cols)) + 1, pane.term.cols),
    row: clamp(Math.floor((e.clientY - r.top) / (r.height / pane.term.rows)) + 1, pane.term.rows),
  };
}

const mouseMods = (e) => (e.altKey ? 8 : 0) + (e.ctrlKey || e.metaKey ? 16 : 0);

function mouseReport(pane, btn, c, press) {
  if (sgrMouse(pane)) return `\x1b[<${btn};${c.col};${c.row}${press ? "M" : "m"}`;
  // The original encoding spends one byte per coordinate, so past column 223 there is
  // nothing truthful to send. Say nothing rather than report the wrong cell.
  if (c.col > 223 || c.row > 223) return "";
  return "\x1b[M" + String.fromCharCode(32 + (press ? btn : 3), 32 + c.col, 32 + c.row);
}

// Shift is the way out, as it is in every terminal: it always means "this one is mine,
// don't give it to the program", which is what leaves selection possible at all while
// an agent is holding the mouse.
const mouseIsOurs = (pane, e) => !pane || !tracking(pane) || e.shiftKey;

function reportButton(e, press) {
  const pane = paneAt(e);
  if (mouseIsOurs(pane, e)) return;
  const c = cellAt(pane, e);
  if (!c) return;
  const btn = (e.button === 1 ? 1 : e.button === 2 ? 2 : 0) + mouseMods(e);
  const seq = mouseReport(pane, btn, c, press);
  if (seq) send(pane, new TextEncoder().encode(seq));
  // Stop here: the terminal's own selection would otherwise start on the same press
  // the program is being told about, and you'd be doing two things with one click.
  e.preventDefault();
  e.stopPropagation();
}

// The vendor opens a link only on ⌘-click. In a browser a link is a link — and it opens
// in a new tab, because navigating this one away would take the dashboard and every
// attached session with it.
async function openLinkAt(pane, e) {
  const det = pane.term.linkDetector;
  if (!det || !pane.term.wasmTerm) return false;
  const c = cellAt(pane, e);
  if (!c) return false;
  const sb = pane.term.wasmTerm.getScrollbackLength();
  const top = Math.max(0, Math.floor(pane.term.getViewportY ? pane.term.getViewportY() : 0));
  const y = c.row - 1;
  const abs = top > 0 ? (y < top ? sb - top + y : sb + y - top) : sb + y;
  let link = null;
  try { link = await det.getLinkAt(c.col - 1, abs); } catch { return false; }
  if (!link || !link.text) return false;
  window.open(link.text, "_blank", "noopener,noreferrer");
  return true;
}

// One set of listeners for every pane, on the container: the terminal registers its own
// in the capture phase on the pane itself, and a parent's capture runs first, which is
// the only place these can win from.
function wireMouse() {
  const box = $("term");
  box.addEventListener("mousedown", (e) => reportButton(e, true), true);
  box.addEventListener("mouseup", (e) => reportButton(e, false), true);
  box.addEventListener("mousemove", (e) => {
    const pane = paneAt(e);
    if (mouseIsOurs(pane, e)) return;
    // 1002 is "while a button is down", 1003 is "always". Neither wants a report per
    // pixel: the program is drawing cells, so it hears about the mouse when it changes
    // cell.
    const track = tracking(pane);
    if (track === 1002 ? !e.buttons : track !== 1003) return;
    const c = cellAt(pane, e);
    if (!c || (pane.at && pane.at.col === c.col && pane.at.row === c.row)) return;
    pane.at = c;
    const held = e.buttons & 2 ? 2 : e.buttons & 4 ? 1 : e.buttons ? 0 : 3;
    const seq = mouseReport(pane, held + 32 + mouseMods(e), c, true);
    if (seq) send(pane, new TextEncoder().encode(seq));
  }, true);
  box.addEventListener("click", (e) => {
    const pane = paneAt(e);
    if (!pane || tracking(pane) || e.shiftKey) return;   // the program's click, or a selection
    void openLinkAt(pane, e);
  }, true);
}

function connect(id, pane) {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const { cols, rows } = pane.term;
  const ws = new WebSocket(
    `${proto}//${location.host}/api/session/socket/${id}?cols=${cols}&rows=${rows}`);
  ws.binaryType = "arraybuffer";
  pane.ws = ws;
  ws.onopen = () => {
    pane.retry = 0;
    pane.dead = false;
    renderBar();
    // The server replays the scrollback on attach, so clear first or a reconnect
    // paints everything twice.
    pane.term.reset();
    // Then fit and *say so*. The size in the URL above is whatever the terminal defaulted to
    // before layout — 80×24 — and the fit that follows fires onResize while the socket
    // is still CONNECTING, so that message was dropped and the program kept drawing
    // into a corner until something else (changing the font) resized it again.
    try { pane.fit.fit(); } catch {}
    send(pane, JSON.stringify({ t: "size", cols: pane.term.cols, rows: pane.term.rows }));
  };
  ws.onmessage = (ev) => {
    if (typeof ev.data === "string") {
      let msg = {};
      try { msg = JSON.parse(ev.data); } catch { return; }
      // The program ended. That's the one close worth believing, so stop trying.
      if (msg.t === "exit") { pane.dead = true; pane.exited = true; refreshSessions(); }
      return;
    }
    // Bytes, not a decoded string: a multi-byte character split across two frames
    // decodes to garbage if each frame is decoded on its own. The terminal reassembles.
    pane.term.write(new Uint8Array(ev.data));
  };
  ws.onclose = () => { pane.dead = true; renderBar(); reconnect(id, pane); };
}

// A socket closes for two different reasons and they need opposite answers: the program
// finished, or something in between dropped — the server restarted, the laptop slept, a
// proxy timed an idle connection out. Only the first is permanent, and treating both that
// way left a live session sitting dead in a pane until you switched away and back.
function reconnect(id, pane) {
  if (pane.exited || PANES.get(id) !== pane) return;
  clearTimeout(pane.retryTimer);
  pane.retry = Math.min((pane.retry || 0) + 1, 10);
  pane.retryTimer = setTimeout(() => {
    if (pane.exited || PANES.get(id) !== pane) return;
    connect(id, pane);
  }, Math.min(400 * pane.retry, 4000));
}

// Input is wired to the *pane*, once, and never to the connection.
//
// onData registrations accumulate: wiring them inside connect() added another
// handler every time a session reconnected, so one keystroke was written twice — and one
// ⌃V after a paste attached the same image twice. Typing "continue" produced
// "ccoonnttiinnuuee".
function wirePane(id, pane) {
  if (pane.wired) return;
  pane.wired = true;
  // Raw bytes: what the terminal emits is what the program reads, with nothing in
  // between to escape or misinterpret.
  const enc = new TextEncoder();
  pane.term.onData((d) => send(pane, enc.encode(d)));
  pane.term.onResize(({ cols, rows }) => {
    // Only the pane you are actually looking at reports its size. A hidden pane, or a
    // backgrounded tab, reporting one is how the PTY oscillated between two sizes.
    if (document.hidden || ACTIVE !== id) return;
    send(pane, JSON.stringify({ t: "size", cols, rows }));
  });
  pane.term.attachCustomWheelEventHandler((e) => {
    // false hands it back to the terminal, which scrolls its own scrollback — right for
    // a shell, and the only thing to do when no program has asked for the wheel.
    if (mouseIsOurs(pane, e)) return false;
    const c = cellAt(pane, e);
    if (!c) return false;
    const cell = pane.wrap.querySelector("canvas").getBoundingClientRect().height / pane.term.rows;
    const lines = e.deltaMode === 1 ? e.deltaY
                : e.deltaMode === 2 ? e.deltaY * pane.term.rows
                : e.deltaY / cell;
    // A trackpad reports a few pixels per event, dozens of times a second. Rounding each
    // of those up to a line — the smallest thing the protocol can say — turned a gentle
    // two-finger drag into a page-a-flick. So the fractions are added up and only whole
    // lines are sent; the remainder waits for the next event.
    if ((pane.wheelAcc || 0) * lines < 0) pane.wheelAcc = 0;   // direction changed
    pane.wheelAcc = (pane.wheelAcc || 0) + lines;
    let whole = Math.trunc(pane.wheelAcc);
    pane.wheelAcc -= whole;
    if (!whole) return true;
    const btn = (whole < 0 ? 64 : 65) + mouseMods(e);
    const seq = mouseReport(pane, btn, c, true);
    if (seq) {
      const enc2 = new TextEncoder();
      for (let i = Math.min(Math.abs(whole), 5); i > 0; i--) send(pane, enc2.encode(seq));
    }
    return true;
  });
}

// A terminal can't carry an image, but an agent takes a *path* — so a pasted
// screenshot is uploaded and its path typed in for you. "Here's what it looks like,
// fix it" is half of working with an agent, and it was simply impossible before.
// Preference order for the same picture in several formats.
const IMAGE_RANK = ["image/png", "image/jpeg", "image/webp", "image/gif"];

async function pasteImages(items, insert) {
  let files = [];
  for (const item of items || []) {
    if (item.kind === "file" && (item.type || "").startsWith("image/")) {
      const f = item.getAsFile();
      if (f) files.push(f);
    }
  }
  if (!files.length) return false;

  // A macOS screenshot arrives as the same picture in two formats — png and tiff — so
  // several *types* means one image described several ways: keep the best. Several
  // files of one type is a genuine multi-image paste, so those all stay.
  const rank = (t) => { const i = IMAGE_RANK.indexOf(t); return i < 0 ? IMAGE_RANK.length : i; };
  files.sort((a, b) => rank(a.type) - rank(b.type));
  if (new Set(files.map(f => f.type)).size > 1) {
    files = files.filter(f => f.type === files[0].type);
  }

  const upload = async (f) => {
    try {
      return await (await fetch("/api/upload", { method: "POST",
        headers: { "Content-Type": f.type }, body: f })).json();
    } catch { return { error: "upload failed" }; }
  };

  const first = await upload(files[0]);
  // The system clipboard holds *one* image and the agent reads it on every ⌃V, so two
  // keystrokes attach the same picture twice — which is what doubled the screenshot.
  // One paste, one keystroke, however many formats the clipboard offered.
  if (first.clipboard) {
    insert("\x16");
    return true;
  }
  // No shared clipboard (a remote instance): each image gets its path instead, in
  // bracketed-paste markers so it arrives as a paste rather than as typing.
  for (let i = 0; i < files.length; i++) {
    const r = i === 0 ? first : await upload(files[i]);
    insert(r.path ? "\x1b[200~" + r.path + "\x1b[201~" : "[" + (r.error || "upload failed") + "]");
  }
  return true;
}

// Everything that reaches a pty goes through here: keystrokes, key-bar taps, resize
// notices, the ⌃V after a paste. A rewrite of the paste path deleted it and every one of
// those silently became a ReferenceError.
// Errors from an action belong next to the thing you clicked, not in a console.
let TOAST = null;
function toast(msg) {
  if (!TOAST) {
    TOAST = el("div", "toast");
    document.body.append(TOAST);
  }
  TOAST.textContent = msg;
  TOAST.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => TOAST.classList.remove("on"), 6000);
}

// The VT is wasm and has to be instantiated once before any terminal exists. Kicked
// off at load so it is almost always ready by the time you open a session.
const VT_READY = GhosttyWeb.init();

let BUILD = null, STALE = false;
// The page keeps running the JS it loaded, so after an upgrade it can be older than the
// server — and then you chase a bug that was fixed an hour ago. Say so instead.
function staleNotice() {
  if (STALE) return;
  STALE = true;
  const bar = el("div", "stale");
  bar.append(el("span", null, "workmux was updated — this page is running the old version."));
  const go = el("button", "b primary", "Reload");
  go.onclick = () => location.reload();
  bar.append(go);
  document.body.append(bar);
}

function send(pane, data) {
  if (pane && pane.ws && pane.ws.readyState === 1) pane.ws.send(data);
}

function sendText(text) { send(PANES.get(ACTIVE), new TextEncoder().encode(text)); }

// Font size survives a reload: on a phone the default is unreadable for some people
// and too big for others, and re-setting it every time is the kind of small friction
// that stops you using the thing.
let FONT = +localStorage.getItem("workmux.font") ||
           (window.matchMedia("(max-width: 820px)").matches ? 11 : 12.5);
function setFont(delta) {
  FONT = Math.max(8, Math.min(22, FONT + delta));
  localStorage.setItem("workmux.font", String(FONT));
  for (const p of PANES.values()) { p.term.options.fontSize = FONT; p.fit.fit(); }
}
function toggleFull() {
  document.body.classList.toggle("full");
  const p = PANES.get(ACTIVE);
  if (p) { setTimeout(() => { p.fit.fit(); p.term.focus(); }, 0); }
}

// The terminal pastes text itself, so only images need handling here.
$("term").addEventListener("paste", (e) => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  const hasImage = [...items].some(i => i.kind === "file" && (i.type || "").startsWith("image/"));
  if (!hasImage) return;
  e.preventDefault();
  pasteImages(items, sendText);
}, true);

function fitSize() {
  const p = PANES.get(ACTIVE);
  if (p) return { cols: p.term.cols, rows: p.term.rows };
  // Nothing open yet: estimate from the box, so the first paint isn't 80×24 inside
  // a window twice that wide.
  const box = $("term").getBoundingClientRect();
  return { cols: Math.max(20, Math.floor(box.width / 7.2)),
           rows: Math.max(6, Math.floor(box.height / 17)) };
}

// A phone keyboard has none of these, and a terminal is unusable without them.
const KEYS = [["esc", "\x1b"], ["tab", "\t"], ["⌃C", "\x03"], ["⌃D", "\x04"],
              ["⇧⏎", "\x1b\r"], ["↑", "\x1b[A"], ["↓", "\x1b[B"],
              ["←", "\x1b[D"], ["→", "\x1b[C"], ["⏎", "\r"]];
// A chord nobody knows about may as well not exist, so the pane says what it has.
const CHORD_HELP = "⌘⏎ newline · ⇧⏎ newline · ⌘←/→ line start/end · ⌥←/→ by word · " +
                   "⌘⌫ kill line · ⇧⇥ back-tab · ⇧drag to select · paste an image to send its path";
function renderKeys() {
  const box = $("keys");
  box.textContent = "";
  if (!ACTIVE) return;
  for (const [label, seq] of KEYS) {
    const b = el("button", "b", label);
    b.onclick = () => {
      const p = PANES.get(ACTIVE);
      if (p && p.ws && p.ws.readyState === 1) p.ws.send(new TextEncoder().encode(seq));
      if (p) p.term.focus();
    };
    box.append(b);
  }
}

// ---- changes ----

let CH = null, CHFILE = null, CHREV = null;

async function loadChanges(force, userAsked) {
  const w = selected();
  if (!w) return;
  if (!force && CH && CH.for === SEL) return renderChanges();
  if (userAsked) loading(true);
  try {
    const d = await (await fetch("/api/changes?path=" + encodeURIComponent(SEL)
      + "&base=" + encodeURIComponent(w.base || ""))).json();
    CH = d; CH.for = SEL;
  } catch { CH = null; }
  if (userAsked) loading(false);
  renderChanges();
}

function renderChanges() {
  // Check *before* clearing. Clearing and then bailing out because a diff was open is
  // what emptied the whole pane — tabs and all — when you clicked Git again.
  if (CHFILE || CHREV) return;              // paintDiff owns the pane
  const bar = $("chbar"), body = $("chbody");
  bar.textContent = ""; body.textContent = "";
  const w = selected();
  if (!w) return;
  bar.append(tabs("changes"));
  const refresh = el("button", "b icon", "↻");
  refresh.title = "Re-read this worktree";
  refresh.onclick = () => loadChanges(true);
  bar.append(refresh);
  bar.append(el("span", "who", (CH && CH.branch) || w.branch));

  if (!CH) { body.append(el("div", "hollow", "Couldn't read this worktree.")); return; }
  const files = CH.files || [], commits = CH.commits || [];

  const section = (label, count) => {
    const h = el("div", "chsect", label);
    h.append(el("span", "count", String(count)));
    body.append(h);
  };

  section("Uncommitted", files.length);
  if (!files.length) body.append(el("div", "hollow", el("p", null, "Working tree is clean.")));
  for (const f of files) {
    const row = el("div", "chrow");
    row.setAttribute("aria-selected", f.path === CHFILE ? "true" : "false");
    row.append(el("span", "st", (f.x + f.y).trim() || "?"));
    row.append(el("span", "f", f.path));
    const n = el("span", "n");
    if (f.add) n.append(el("span", "a", "+" + f.add));
    if (f.add && f.del) n.append(document.createTextNode(" "));
    if (f.del) n.append(el("span", "d", "−" + f.del));
    row.append(n);
    row.onclick = () => showFileDiff(f);
    body.append(row);
  }

  section("Ahead of " + (CH.base || w.base || "base"), commits.length);
  if (!commits.length) {
    body.append(el("div", "hollow", el("p", null, "Nothing this base doesn't already have.")));
  }
  for (const c of commits) {
    const row = el("div", "chrow");
    row.setAttribute("aria-selected", c.sha === CHREV ? "true" : "false");
    row.append(el("code", "sha", c.sha.slice(0, 8)));
    row.append(el("span", "subject", c.msg));
    if (!c.pushed) row.append(el("span", "local", "local"));
    row.onclick = () => showCommitDiff(c);
    body.append(row);
  }
}

async function showFileDiff(f) {
  CHFILE = f.path; CHREV = null;
  renderChanges();
  let d;
  try {
    d = await (await fetch("/api/diff?path=" + encodeURIComponent(SEL)
      + "&file=" + encodeURIComponent(f.path) + (f.staged ? "&staged=1" : ""))).json();
  } catch { d = { error: "could not read the diff" }; }
  paintDiff(f.path, d.diff, d.error);
}

async function showCommitDiff(c) {
  CHREV = c.sha; CHFILE = null;
  renderChanges();
  let d;
  try {
    d = await (await fetch("/api/diff?path=" + encodeURIComponent(SEL)
      + "&rev=" + encodeURIComponent(c.sha))).json();
  } catch { d = { error: "could not read the commit" }; }
  paintDiff(c.sha + "  " + c.msg, d.diff, d.error);
}

// A commit is many files, and git prints them end to end with nothing between them but
// a line starting "diff --git". Read as one scroll that's unreadable, so the diff is cut
// back into the files it was made of. The parsing is here rather than in a library
// because splitting on that line is the whole job: what a diff renderer would add is a
// second visual language to keep in sync with this one.
const FILE_HEAD = /^(diff --git |\+\+\+ |--- |index |new file|deleted file|similarity |rename |old mode|new mode|Binary files )/;

function splitDiff(diff) {
  const files = [];
  const preamble = [];
  let f = null;
  for (const line of diff.split("\n")) {
    if (line.startsWith("diff --git ")) {
      f = { path: (line.match(/ b\/(.*)$/) || [, line.slice(11)])[1], lines: [], add: 0, del: 0, bin: false };
      files.push(f);
      continue;
    }
    if (!f) { preamble.push(line); continue; }
    // The +++ line is the authoritative name: a rename says one thing in the header and
    // another here, and here is where it ends up.
    if (line.startsWith("+++ b/")) { f.path = line.slice(6); continue; }
    if (line.startsWith("Binary files")) f.bin = true;
    if (FILE_HEAD.test(line) && !line.startsWith("--- ")) continue;
    if (line.startsWith("--- ")) continue;
    if (line.startsWith("+") && !line.startsWith("+++")) f.add++;
    else if (line.startsWith("-") && !line.startsWith("---")) f.del++;
    f.lines.push(line);
  }
  while (preamble.length && !preamble[preamble.length - 1].trim()) preamble.pop();
  return { preamble, files };
}

function diffLine(line) {
  let cls = "l";
  if (line.startsWith("@@")) cls += " hunk";
  else if (line.startsWith("+")) cls += " add";
  else if (line.startsWith("-")) cls += " del";
  else if (line.startsWith("\\")) cls += " meta";
  return el("div", cls, line || " ");
}

// A diff is rendered line by line rather than as one blob so additions and
// deletions can be coloured, and so each file's name stays put while you scroll it.
function paintDiff(title, diff, error) {
  const bar = $("chbar"), body = $("chbody");
  bar.textContent = ""; body.textContent = "";
  bar.append(tabs("changes"));
  const back = el("button", "b", "‹ files");
  back.onclick = () => { CHFILE = null; CHREV = null; renderChanges(); };
  bar.append(back);
  bar.append(el("span", "who", title));

  const box = el("div", "diff");
  if (error) { box.append(el("div", "hollow", el("p", null, error))); body.append(box); return; }
  if (!diff) {
    box.append(el("div", "hollow", el("p", null, "No changes in this file.")));
    body.append(box); return;
  }
  const { preamble, files } = splitDiff(diff);
  // A commit message can run longer than a screen, and it was pushing every file below
  // the fold — the opposite of what splitting them up was for. So it folds.
  if (preamble.length) {
    const msg = el("details", "dmsg");
    msg.open = preamble.length <= 10;
    const head = el("summary", "dhead");
    head.append(el("span", "n", "message"));
    head.append(el("span", "bin", preamble.length + " lines"));
    msg.append(head);
    const lines = el("div", "dlines");
    for (const line of preamble) lines.append(el("div", "l meta", line || " "));
    msg.append(lines);
    box.append(msg);
  }
  if (!files.length) for (const line of diff.split("\n")) box.append(diffLine(line));

  if (files.length) {
    const tot = el("div", "dtotal");
    const add = files.reduce((n, f) => n + f.add, 0), del = files.reduce((n, f) => n + f.del, 0);
    tot.append(el("span", "n", files.length + (files.length === 1 ? " file" : " files")));
    if (add) tot.append(el("span", "plus", "+" + add));
    if (del) tot.append(el("span", "minus", "−" + del));
    box.append(tot);
  }

  // Small enough to read in one go: leave it open. A twelve-file commit opens as a list
  // of what it touched, which is the thing you actually wanted to know first.
  const total = files.reduce((n, f) => n + f.lines.length, 0);
  const openAll = files.length === 1 || total <= 400;
  for (const f of files) {
    const sec = el("details", "dfile");
    sec.open = openAll;
    const head = el("summary", "dhead");
    head.append(el("span", "n", f.path));
    if (f.bin) head.append(el("span", "bin", "binary"));
    if (f.add) head.append(el("span", "plus", "+" + f.add));
    if (f.del) head.append(el("span", "minus", "−" + f.del));
    sec.append(head);
    const lines = el("div", "dlines");
    for (const line of f.lines) lines.append(diffLine(line));
    sec.append(lines);
    box.append(sec);
  }
  body.append(box);
}

// ---- sheets: new work, mcp, the log ----

let SHEET = null;

function openSheet(which) {
  SHEET = which;
  $("scrim").classList.add("on");
  $("sheet").classList.add("on");
  $("sbody").className = "sbody";
  if (which === "new") renderNew();
  if (which === "mcp") renderMcp(false);
  if (which === "log") renderLog();
  if (which === "stacks") renderStacks(false);
  if (which === "keys") renderKeysSheet();
  if (which === "more") renderMore();
}
function closeSheet() {
  SHEET = null;
  $("scrim").classList.remove("on");
  $("sheet").classList.remove("on");
}

function renderNew() {
  $("stitle").textContent = "New work";
  const body = $("sbody"), foot = $("sfoot");
  body.textContent = ""; foot.textContent = "";
  // No branch name asked for: it comes from what you wrote. Needing to invent one
  // before starting is exactly the friction that stops people branching.
  const task = el("label", null, "What needs doing? The branch name comes from this.");
  const ta = el("textarea");
  ta.placeholder = "e.g. hotel search times out on long stays";
  task.append(ta);
  const nameLbl = el("label", null, "Branch name (optional)");
  const name = el("input"); name.placeholder = "derived from the task";
  nameLbl.append(name);
  const baseLbl = el("label", null, "Base branch");
  const base = el("input"); base.placeholder = (STATE && STATE.base) || "main";
  baseLbl.append(base);
  const note = el("div", "note",
    "It branches off the remote, copies the gitignored files a worktree needs, starts an agent, "
    + "and starts no containers — attach a stack later if the change turns out to need one.");
  body.append(task, nameLbl, baseLbl, note);
  // A pasted screenshot belongs here too: it's the same "here's what's wrong".
  ta.addEventListener("paste", (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    if ([...items].some(i => i.kind === "file" && (i.type || "").startsWith("image/"))) {
      e.preventDefault();
      pasteImages(items, (t) => {
        const at = ta.selectionStart || ta.value.length;
        ta.value = ta.value.slice(0, at) + t.replace(/\x1b\[20[01]~|\x16/g, "") + ta.value.slice(at);
      });
    }
  });

  const go = el("button", "b on", "Create");
  const status = el("span", "meta", "");
  go.onclick = async () => {
    go.disabled = true; status.textContent = "creating…";
    let r;
    try {
      r = await (await fetch("/api/new", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name.value, prompt: ta.value, base: base.value }) })).json();
    } catch { r = { error: "server unreachable" }; }
    go.disabled = false;
    if (r.error) { status.textContent = r.error; return; }
    closeSheet();
    SEL = r.path; CH = null;
    await poll();
    setSurface("session");
  };
  foot.append(go, status);
  setTimeout(() => ta.focus(), 30);
}

async function renderMcp(refresh) {
  $("stitle").textContent = "MCP servers";
  const body = $("sbody"), foot = $("sfoot");
  body.textContent = ""; foot.textContent = "";
  body.append(el("div", "hollow", el("p", null, "checking…")));
  let d;
  try { d = await (await fetch("/api/mcp" + (refresh ? "?refresh=1" : ""))).json(); }
  catch { d = { servers: [] }; }
  body.textContent = "";
  if (!d.enabled) {
    body.append(el("div", "hollow", el("p", null, "This project has no mcp command configured.")));
    return;
  }
  const servers = d.servers || [];
  if (!servers.length) body.append(el("div", "hollow", el("p", null,
    "No MCP servers registered. Add one below — it goes through the agent CLI.")));
  for (const x of servers) {
    const card = el("div", "srv");
    card.dataset.state = x.state;
    const nm = el("div", "nm");
    nm.append(el("i", "dot"), document.createTextNode(x.name));
    if (x.scope) nm.append(el("span", "scope", x.scope));
    card.append(nm);
    card.append(el("div", "dt", x.target || x.command || ""));
    // Registration is not reachability, so the reason goes next to the name.
    if (x.state !== "ok") card.append(el("div", "dt", x.detail || ""));
    if (x.suggest) card.append(el("div", "dt", "found at " + x.suggest + " — not on the PATH it runs with"));
    const row = el("div", "row");
    if (x.state === "auth") {
      const b = el("button", "b", "authenticate");
      b.title = "Opens an agent session and runs /mcp, where the OAuth round happens";
      b.onclick = async () => {
        closeSheet();
        await start("agent");
        setTimeout(() => sendText("/mcp\r"), 1500);
      };
      row.append(b);
    }
    const rm = el("button", "b", "remove");
    rm.onclick = async () => {
      if (!confirm("Remove MCP server " + x.name + (x.scope ? " (" + x.scope + ")" : "") + "?")) return;
      const scope = (x.scope || "").startsWith("local") ? "local" : x.scope;
      await fetch("/api/mcp/remove", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: x.name, scope }) }).catch(() => {});
      renderMcp(true);
    };
    row.append(rm);
    card.append(row);
    body.append(card);
  }

  const addBtn = el("button", "b", "＋ add a server");
  addBtn.onclick = () => renderMcpAdd();
  const refreshBtn = el("button", "b", "↻ re-check");
  refreshBtn.onclick = () => renderMcp(true);
  foot.append(addBtn, refreshBtn);
}

function renderMcpAdd() {
  const body = $("sbody"), foot = $("sfoot");
  body.textContent = ""; foot.textContent = "";
  $("stitle").textContent = "Add an MCP server";
  const f = {};
  const field = (key, label, placeholder, tag) => {
    const l = el("label", null, label);
    const i = el(tag || "input");
    i.placeholder = placeholder || "";
    l.append(i); body.append(l); f[key] = i;
  };
  field("name", "Name", "grafana");
  field("target", "URL, or the command to run", "https://mcp.example.com or mcp-grafana --flag");
  const tl = el("label", null, "Transport");
  const t = el("select");
  for (const v of ["stdio", "http", "sse"]) t.append(el("option", null, v));
  tl.append(t); body.append(tl); f.transport = t;
  const sl = el("label", null, "Scope — who sees it");
  const sc = el("select");
  for (const v of ["user", "project", "local"]) sc.append(el("option", null, v));
  sl.append(sc); body.append(sl); f.scope = sc;
  field("env", "Environment, one KEY=value per line", "TOKEN=…", "textarea");
  field("headers", "Headers, one Name: value per line", "Authorization: Bearer …", "textarea");
  body.append(el("div", "note",
    "This shells out to the agent CLI, so the CLI stays the source of truth for what's registered."));

  const save = el("button", "b on", "Add");
  const status = el("span", "meta", "");
  save.onclick = async () => {
    save.disabled = true; status.textContent = "adding…";
    const lines = (v) => v.split("\n").map(x => x.trim()).filter(Boolean);
    let r;
    try {
      r = await (await fetch("/api/mcp/add", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: f.name.value, target: f.target.value,
          transport: f.transport.value, scope: f.scope.value,
          env: lines(f.env.value), headers: lines(f.headers.value) }) })).json();
    } catch { r = { error: "server unreachable" }; }
    save.disabled = false;
    if (r.error) { status.textContent = r.error; return; }
    renderMcp(true);
  };
  const back = el("button", "b", "‹ back");
  back.onclick = () => renderMcp(false);
  foot.append(save, back, status);
}

}

// ---- stacks: what is running, and what it costs ----

const gb = (n) => n >= 1 << 30 ? (n / (1 << 30)).toFixed(1) + " GB"
                : n >= 1 << 20 ? Math.round(n / (1 << 20)) + " MB" : (n || 0) + " B";

function upFor(epoch) {
  if (!epoch) return "";
  const s = Date.now() / 1000 - epoch;
  if (s < 90) return "up just now";
  if (s < 3600) return "up " + Math.round(s / 60) + "m";
  if (s < 86400) return "up " + Math.round(s / 3600) + "h";
  return "up " + Math.round(s / 86400) + "d";
}

async function renderStacks(quiet) {
  $("stitle").textContent = "Stacks";
  const body = $("sbody"), foot = $("sfoot");
  if (!quiet) {
    body.textContent = ""; foot.textContent = "";
    body.append(el("div", "hollow", el("p", null, "asking docker…")));
  }
  let d;
  try { d = await (await fetch("/api/stacks")).json(); } catch { d = { enabled: false, error: 1 }; }
  if (SHEET !== "stacks") return;              // you closed it while docker was thinking
  body.textContent = ""; foot.textContent = "";

  if (!d.enabled) { stackSetup(body); return; }

  const stacks = d.stacks || [], m = d.machine || {};
  // The machine line first: what one stack costs means little without what it's a share of.
  const sum = el("div", "usage");
  const cell = (k, v, sub) => {
    const c = el("div", "u");
    c.append(el("div", "k", k), el("div", "v", v));
    if (sub) c.append(el("div", "s", sub));
    sum.append(c);
  };
  cell("stacks", String(stacks.length), stacks.length ? "of this repo" : "none running");
  cell("cpu", (m.cpu || 0).toFixed(0) + "%", "of one core · " + (m.containers || 0) + " containers");
  cell("memory", gb(m.mem_bytes || 0), m.mem_total ? "of " + gb(m.mem_total) + " docker has" : "");
  if (m.others) cell("not yours", String(m.others), "containers from elsewhere");
  body.append(sum);

  if (!stacks.length) {
    body.append(el("div", "hollow",
      el("h3", null, d.docker ? "No stack of this repo is running." : "Docker isn't answering."),
      el("p", null, d.docker
        ? "Start one from a piece of work — it takes the next free slot" +
          (d.next_slot ? ", which is " + d.next_slot + "." : ".")
        : "Nothing here can be read until it is, and the rest of the dashboard doesn't need it.")));
    return;
  }

  for (const s of stacks) {
    const w = WORK.find(x => x.path === s.path);
    const card = el("div", "srv");
    card.dataset.state = s.up === s.total ? "ok" : "fail";
    const nm = el("div", "nm");
    nm.append(el("i", "dot"), document.createTextNode(s.slot));
    if (w) nm.append(el("span", "scope", w.branch));
    card.append(nm);
    card.append(el("div", "dt",
      [s.up + "/" + s.total + " up", (s.cpu || 0).toFixed(0) + "% cpu",
       gb(s.mem_bytes || 0), upFor(s.started_epoch)].filter(Boolean).join("  ·  ")));
    const down = (s.services || []).filter(x => x.state !== "running").map(x => x.name);
    if (down.length) card.append(el("div", "dt", "not running: " + down.join(", ")));

    const row = el("div", "row");
    if (s.url) {
      const a = el("a", "b", "open");
      a.href = s.url; a.target = "_blank"; a.rel = "noopener";
      row.append(a);
    }
    const act = (label, fn, title) => {
      const b = el("button", "b", label);
      if (title) b.title = title;
      b.onclick = fn;
      row.append(b);
    };
    act("restart", async () => { await stackAction("restart", w || { stack: s }); renderStacks(true); });
    act("stop", async () => { await stackAction("stop", w || { stack: s }); renderStacks(true); },
        "Frees the slot and the memory it is holding");
    if (w) act("go to work", () => {
      closeSheet(); SEL = w.path; markSeen(w.path); renderWork(); showWork(true);
    });
    card.append(row);
    body.append(card);
  }

  const again = el("button", "b", "↻ refresh");
  again.onclick = () => renderStacks(false);
  foot.append(again);
}

// No stack configured is a normal answer — most repos don't have one. Say what it would
// buy and exactly what to write, rather than showing an empty panel.
function stackSetup(body) {
  body.append(el("div", "hollow",
    el("h3", null, "This project has no stack."),
    el("p", null, "A stack is the containers one piece of work runs on: its own compose " +
                  "project, its own slot, its own URL. With one configured, every worktree " +
                  "can bring its app up beside the others instead of fighting over one set " +
                  "of ports."),
    el("p", null, "workmux init writes this for you when it finds a compose file. By hand, " +
                  "it goes in workmux.json at the repo root:")));
  const snip = el("pre", "snip");
  snip.textContent = JSON.stringify({
    stack: {
      compose: "docker-compose.yml",
      slots: ((STATE && STATE.name) || "app") + "{n}",
      url: "http://{slot}.localhost",
    },
  }, null, 2);
  body.append(snip);
  body.append(el("div", "hollow",
    el("p", null, "slots is the naming pattern for each worktree's compose project, where " +
                  "{n} is the slot number. url is where that slot answers — leave it out " +
                  "and workmux won't offer an Open button rather than offering a broken one."),
    el("p", null, "examples/localhost-routing in the workmux repo is a working two-slot " +
                  "setup behind a proxy, if you want names rather than ports.")));
}

// The chords, on request rather than dumped into an empty pane.
function renderKeysSheet() {
  $("stitle").textContent = "Keyboard";
  const body = $("sbody"), foot = $("sfoot");
  body.className = "sbody"; body.textContent = ""; foot.textContent = "";
  const rows = [
    ["⌘⏎ / ⇧⏎", "New line, without submitting"],
    ["⇧⇥", "Back-tab — what an agent cycles its mode on"],
    ["⌘← / ⌘→", "Start and end of the line"],
    ["⌥← / ⌥→", "A word at a time"],
    ["⌘⌫ / ⌥⌫", "Kill the line, kill a word"],
    ["⌘N", "New work"],
    ["/", "Filter the work list"],
    ["Esc", "Close this"],
    ["⌃C / ⌃D", "Interrupt, end of input — sent to the program, not the browser"],
    ["⇧ drag", "Select text while a program is holding the mouse"],
    ["Click a link", "Opens in a new tab. A program that wants clicks gets them instead"],
    ["Paste an image", "Goes to the agent through your clipboard"],
  ];
  for (const [k, what] of rows) {
    const r = el("div", "chrow");
    r.style.cursor = "default";
    r.append(el("code", "sha", k), el("span", "subject", what));
    r.querySelector(".sha").style.flex = "0 0 11ch";
    body.append(r);
  }
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && SHEET) { closeSheet(); return; }
  // ⌘N for new work, the one thing you start from anywhere. Not while typing in a
  // terminal, which owns its keystrokes.
  if ((e.metaKey || e.ctrlKey) && e.key === "n") { e.preventDefault(); openSheet("new"); }
  // "/" reaches the filter — but only from outside a terminal, which owns every key it
  // is given, slash included.
  if (e.key === "/" && !e.metaKey && !e.ctrlKey && !e.altKey) {
    const inTerm = document.activeElement && document.activeElement.closest &&
                   document.activeElement.closest("#term");
    const typing = document.activeElement &&
                   /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (inTerm || typing) return;
    e.preventDefault();
    setSurface("work");
    $("filter").focus();
    $("filter").select();
  }
});

function setSurface(which) {
  $("main").dataset.surface = which;
  for (const [id, key] of [["nav-work","work"],["nav-session","session"],["nav-changes","changes"]]) {
    $(id).setAttribute("aria-current", which === key ? "true" : "false");
  }
  if (which === "changes") loadChanges(false);
  const p = PANES.get(ACTIVE);
  if (which === "session" && p) { p.fit.fit(); p.term.focus(); }
}

// The PTY has to match the box, and the box changes for reasons a resize event
// doesn't cover: the key bar appearing, a phone keyboard opening, switching surfaces,
// fonts loading. Watching the element itself catches all of them, and it's the one
// place that calls fit.
let refitTimer = null;
function refit() {
  clearTimeout(refitTimer);
  refitTimer = setTimeout(() => {
    const p = PANES.get(ACTIVE);
    if (!p) return;
    const box = $("term").getBoundingClientRect();
    if (box.height < 40 || box.width < 80) return;   // hidden or mid-layout
    try { p.fit.fit(); } catch {}
  }, 60);
}
if (window.ResizeObserver) new ResizeObserver(refit).observe($("term"));
window.addEventListener("resize", refit);
window.addEventListener("orientationchange", refit);
if (window.visualViewport) {
  // iOS changes the visible height when the keyboard opens without firing resize.
  window.visualViewport.addEventListener("resize", refit);
  window.visualViewport.addEventListener("scroll", refit);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);

wireMouse();
$("filter").addEventListener("input", (e) => { FILTER = e.target.value; renderWork(); });
$("filter").addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.stopPropagation(); FILTER = ""; e.target.value = ""; renderWork(); }
});
poll(true);
// Six seconds, and nothing at all while the tab is in the background — a dashboard
// nobody is looking at doesn't need to ask.
setInterval(() => { if (!document.hidden) poll(false); }, 6000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(false); });
</script>
