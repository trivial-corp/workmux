<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>workmux</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  :root { color-scheme: dark; --bg:#0e0e13; --panel:#15151c; --elev:#1a1a22; --ink:#e7e7ee;
          --dim:#9a9aae; --line:#26262f; --ok:#4ade80; --warn:#fbbf24; --live:#60a5fa; }
  * { box-sizing: border-box; min-width: 0; }
  html, body { height: 100%; }
  body { margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
         font:14px/1.45 ui-sans-serif,-apple-system,system-ui,sans-serif;
         display:flex; flex-direction:column; }
  header { display:flex; gap:10px; align-items:baseline; padding:11px 14px;
           border-bottom:1px solid var(--line); flex:0 0 auto; }
  h1 { margin:0; font-size:14px; font-weight:600; letter-spacing:.02em; }
  .meta { color:var(--dim); font-size:12px; overflow-wrap:anywhere; }
  main { flex:1 1 auto; display:grid; grid-template-columns:minmax(0,300px) minmax(0,1fr);
         min-height:0; }
  .list { border-right:1px solid var(--line); overflow-y:auto; padding:10px; display:grid;
          gap:7px; align-content:start; min-width:0; }
  .w { background:var(--panel); border:1px solid var(--line); border-radius:9px;
       padding:9px 10px; cursor:pointer; }
  .w.on { border-color:#3a3a55; background:var(--elev); }
  .top { display:flex; gap:6px; align-items:baseline; flex-wrap:wrap; }
  .br { font-weight:600; overflow-wrap:anywhere; font-size:13px; }
  .tag { font-size:10.5px; color:var(--dim); border:1px solid var(--line); border-radius:5px;
         padding:0 5px; white-space:nowrap; }
  .tag.live { color:var(--live); border-color:#2b4a72; }
  .tag.blocked { color:var(--warn); border-color:#5a4416; }
  .tag.up { color:var(--ok); border-color:#1f5133; }
  .sub { color:var(--dim); font-size:11.5px; margin-top:3px; overflow-wrap:anywhere; }
  .pane { display:flex; flex-direction:column; min-width:0; min-height:0; }
  .bar { display:flex; gap:6px; align-items:center; padding:7px 10px; flex:0 0 auto;
         border-bottom:1px solid var(--line); overflow-x:auto; }
  .b { background:var(--elev); color:var(--ink); border:1px solid var(--line); border-radius:6px;
       padding:3px 9px; font-size:12px; cursor:pointer; white-space:nowrap; font-family:inherit; }
  .b:hover { border-color:#3a3a55; }
  .b.on { border-color:#4a6ea8; color:#cfe0ff; }
  .b.dead { color:var(--dim); text-decoration:line-through; }
  .term { flex:1 1 auto; min-height:0; padding:6px 2px 2px 8px; }
  .term .xterm { height:100%; }
  .empty { color:var(--dim); padding:14px; font-size:13px; }
  .keys { display:none; gap:5px; padding:6px 8px; border-top:1px solid var(--line);
          flex:0 0 auto; overflow-x:auto; }
  nav { display:none; }
  /* One surface at a time on a phone, with the key bar a terminal needs there. */
  @media (max-width: 820px) {
    main { grid-template-columns:1fr; }
    .pane { display:none; }
    main.session .pane { display:flex; }
    main.session .list { display:none; }
    .keys { display:flex; }
    nav { display:flex; flex:0 0 auto; border-top:1px solid var(--line); }
    nav button { flex:1; background:none; border:0; color:var(--dim); padding:10px;
                 font:inherit; font-size:12px; }
    nav button.on { color:var(--ink); }
  }
</style>

<header>
  <h1 id="who">workmux</h1>
  <span class="meta" id="meta">loading…</span>
</header>

<main id="main">
  <div class="list" id="list"></div>
  <div class="pane">
    <div class="bar" id="bar"></div>
    <div class="term" id="term"></div>
    <div class="keys" id="keys"></div>
  </div>
</main>

<nav>
  <button id="nav-work" class="on" onclick="setSurface('work')">Work</button>
  <button id="nav-session" onclick="setSurface('session')">Session</button>
</nav>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/xterm-addon-fit.js"></script>
<script>
// Plain DOM on purpose, for now: this is being replaced by a TS build that a mobile
// app will load as well, and porting the same logic twice is how details get lost.
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
                          if (x != null) n.textContent = x; return n; };
const $ = (id) => document.getElementById(id);

let STATE = null, WORK = [], SEL = null, SESSIONS = [], ACTIVE = null;
const PANES = new Map();   // session id → {term, fit, ws, dead}

// ---- work ----

async function poll() {
  let d;
  try { d = await (await fetch("/api/work")).json(); }
  catch { $("meta").textContent = "server unreachable"; return; }
  STATE = d; WORK = d.work || [];
  // Several instances at once is normal — one per project, plus one you're
  // developing — so the tab has to say which. Project first: titles truncate right.
  document.title = d.name ? d.name + " · workmux" : "workmux";
  $("who").textContent = d.name ? d.name + " · workmux" : "workmux";
  $("meta").textContent = [WORK.length + " worktrees", "base " + d.base,
    d.stack_enabled ? "next " + d.next_slot : "no stack",
    (d.agent && d.agent.name) || "no agent"].join(" · ");
  if (!SEL || !WORK.some(w => w.path === SEL)) SEL = (WORK[0] || {}).path || null;
  renderWork();
  await refreshSessions();
}

function renderWork() {
  const list = $("list");
  list.textContent = "";
  if (!WORK.length) list.append(el("p", "empty", "No worktrees yet."));
  for (const w of WORK) {
    const card = el("div", "w" + (w.path === SEL ? " on" : ""));
    const top = el("div", "top");
    top.append(el("span", "br", w.branch));
    if (w.is_default) top.append(el("span", "tag", "base"));
    if (w.live) top.append(el("span", "tag live", "working"));
    if (w.tempo === "blocked") top.append(el("span", "tag blocked", "needs input"));
    if (w.stack) top.append(el("span", "tag up", "app " + w.stack.slot + " " + w.stack.up + "/" + w.stack.total));
    for (const n of (w.prs || []).slice(0, 3)) top.append(el("span", "tag", "#" + n));
    if (w.behind > 0) top.append(el("span", "tag", "⇣" + w.behind));
    card.append(top);
    const bits = [];
    for (const a of w.agents || []) bits.push((a.name || a.id) + (a.tempo ? " · " + a.tempo : ""));
    for (const s of w.sessions || []) bits.push("▸ " + (s.title || s.kind));
    if (bits.length) card.append(el("div", "sub", bits.join("  —  ")));
    card.onclick = () => { SEL = w.path; ACTIVE = null; renderWork(); renderBar(); };
    list.append(card);
  }
}

const selected = () => WORK.find(w => w.path === SEL) || null;

// ---- sessions ----

async function refreshSessions() {
  try {
    const d = await (await fetch("/api/session/list")).json();
    SESSIONS = d.sessions || [];
  } catch { SESSIONS = []; }   // --no-terminal: the route isn't there at all
  renderBar();
}

function renderBar() {
  const bar = $("bar");
  bar.textContent = "";
  if (!STATE) return;
  if (STATE.terminal === false) {
    bar.append(el("span", "empty", "Terminals are off (--no-terminal)."));
    return;
  }
  const w = selected();
  if (!w) return;

  // Only this worktree's sessions, so a tab always means something here.
  const mine = SESSIONS.filter(s => s.cwd === SEL);
  for (const s of mine) {
    const b = el("button", "b" + (s.id === ACTIVE ? " on" : "") + (s.alive ? "" : " dead"),
                 s.title || s.kind);
    b.onclick = () => open(s.id);
    bar.append(b);
  }
  const caps = STATE.agent || {};
  const add = (label, fn, title) => {
    const b = el("button", "b", label);
    b.onclick = fn;
    if (title) b.title = title;
    bar.append(b);
  };
  // Absent capability, absent button: what this project can't do isn't offered.
  if (w.agents && w.agents.length && caps.attach) {
    add("❯ resume", () => start("resume"), "Take over this worktree's agent");
  } else if (caps.run) {
    add("＋ " + (caps.name || "agent"), () => start("agent"));
  }
  add("＋ shell", () => start("shell"));
  add("＋ git", () => start("git"));
  if (w.stack) add("＋ logs", () => start("logs"));
  if (ACTIVE) add("✕", () => kill(ACTIVE), "Kill this session");
  if (!ACTIVE) showEmpty(mine.length);
}

function showEmpty(existing) {
  const t = $("term");
  t.textContent = "";
  t.append(el("div", "empty", existing
    ? "Pick a session above."
    : "No session here yet. Start one above — it lives in the server, so a reload reattaches."));
}

async function start(kind) {
  const size = fitSize();
  let r;
  try {
    r = await (await fetch("/api/session/new", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ kind, cwd: SEL, cols: size.cols, rows: size.rows }),
    })).json();
  } catch { return; }
  if (r.error) {
    const t = $("term"); t.textContent = ""; t.append(el("div", "empty", r.error));
    return;
  }
  await refreshSessions();
  open(r.id);
}

async function kill(id) {
  await fetch("/api/session/kill", { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id }) }).catch(() => {});
  const p = PANES.get(id);
  if (p) { p.term.dispose(); PANES.delete(id); }
  if (ACTIVE === id) ACTIVE = null;
  await refreshSessions();
}

// open attaches a pane, reusing one we already have so switching back doesn't
// repaint from scratch.
function open(id) {
  ACTIVE = id;
  setSurface("session");
  const box = $("term");
  box.textContent = "";
  let pane = PANES.get(id);
  if (!pane) {
    const term = new Terminal({
      fontSize: window.matchMedia("(max-width: 820px)").matches ? 11 : 12.5,
      fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
      cursorBlink: true, scrollback: 5000,
      theme: { background: "#0e0e13", foreground: "#e7e7ee", cursor: "#e7e7ee" },
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    pane = { term, fit, ws: null, dead: false };
    PANES.set(id, pane);
  }
  pane.term.open(box);
  pane.fit.fit();
  if (!pane.ws || pane.ws.readyState > 1) connect(id, pane);
  pane.term.focus();
  renderBar();
  renderKeys();
}

function connect(id, pane) {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const { cols, rows } = pane.term;
  const ws = new WebSocket(
    `${proto}//${location.host}/api/session/socket/${id}?cols=${cols}&rows=${rows}`);
  ws.binaryType = "arraybuffer";
  pane.ws = ws;
  const dec = new TextDecoder();
  ws.onmessage = (ev) => {
    if (typeof ev.data === "string") {
      let msg = {};
      try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.t === "exit") { pane.dead = true; refreshSessions(); }
      return;
    }
    pane.term.write(dec.decode(ev.data));
  };
  ws.onclose = () => { pane.dead = true; renderBar(); };
  // Keystrokes go as raw bytes: what the terminal emits is what the program reads,
  // with nothing in between to escape or misinterpret.
  const enc = new TextEncoder();
  pane.term.onData((d) => { if (ws.readyState === 1) ws.send(enc.encode(d)); });
  pane.term.onResize(({ cols, rows }) => {
    if (ws.readyState === 1) ws.send(JSON.stringify({ t: "size", cols, rows }));
  });
}

// A terminal can't carry an image, but an agent takes a *path* — so a pasted
// screenshot is uploaded and its path typed in for you. "Here's what it looks like,
// fix it" is half of working with an agent, and it was simply impossible before.
async function pasteImages(items, insert) {
  const files = [];
  for (const item of items || []) {
    if (item.kind === "file" && (item.type || "").startsWith("image/")) {
      const f = item.getAsFile();
      if (f) files.push(f);
    }
  }
  if (!files.length) return false;
  for (const f of files) {
    let r;
    try {
      r = await (await fetch("/api/upload", { method: "POST",
        headers: { "Content-Type": f.type }, body: f })).json();
    } catch { insert("[upload failed]"); continue; }
    // A trailing space so a second paste, or typed words after it, don't run into
    // the path.
    insert(r.path ? r.path + " " : "[" + (r.error || "upload failed") + "]");
  }
  return true;
}

function sendText(text) {
  const p = PANES.get(ACTIVE);
  if (p && p.ws && p.ws.readyState === 1) p.ws.send(new TextEncoder().encode(text));
}

// The terminal: xterm.js pastes text itself, so only images need handling here.
$("term").addEventListener("paste", (e) => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  const hasImage = [...items].some(i => i.kind === "file" && (i.type || "").startsWith("image/"));
  if (!hasImage) return;
  e.preventDefault();
  pasteImages(items, sendText);
}, true);

function fitSize() {
  const p = PANES.get(ACTIVE);
  if (p) return { cols: p.term.cols, rows: p.term.rows };
  // Nothing open yet: estimate from the box, so the first paint isn't 80×24 inside
  // a window twice that wide.
  const box = $("term").getBoundingClientRect();
  return { cols: Math.max(20, Math.floor(box.width / 7.2)),
           rows: Math.max(6, Math.floor(box.height / 17)) };
}

// A phone keyboard has none of these, and a terminal is unusable without them.
const KEYS = [["esc", "\x1b"], ["tab", "\t"], ["⌃C", "\x03"], ["⌃D", "\x04"],
              ["↑", "\x1b[A"], ["↓", "\x1b[B"], ["←", "\x1b[D"], ["→", "\x1b[C"], ["⏎", "\r"]];
function renderKeys() {
  const box = $("keys");
  box.textContent = "";
  if (!ACTIVE) return;
  for (const [label, seq] of KEYS) {
    const b = el("button", "b", label);
    b.onclick = () => {
      const p = PANES.get(ACTIVE);
      if (p && p.ws && p.ws.readyState === 1) p.ws.send(new TextEncoder().encode(seq));
      if (p) p.term.focus();
    };
    box.append(b);
  }
}

function setSurface(which) {
  $("main").classList.toggle("session", which === "session");
  $("nav-work").classList.toggle("on", which !== "session");
  $("nav-session").classList.toggle("on", which === "session");
  const p = PANES.get(ACTIVE);
  if (which === "session" && p) { p.fit.fit(); p.term.focus(); }
}

// Refit on rotate, on window changes, and when a phone keyboard appears — that
// changes the visible height without firing a window resize on iOS.
const refit = () => { const p = PANES.get(ACTIVE); if (p) p.fit.fit(); };
window.addEventListener("resize", refit);
if (window.visualViewport) window.visualViewport.addEventListener("resize", refit);

poll();
setInterval(poll, 4000);
</script>
