# The reverse proxy: started once, left running, owns port 80.
#
# Separate from your app's compose file on purpose. It has to outlive any individual
# stack — you restart those constantly — and it's shared by all of them, so putting
# it in the app's file would mean one slot owning the port and the rest failing.
name: edge

services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --providers.docker=true
      # Nothing is exposed unless it says so, so an unrelated container on your
      # machine can't accidentally claim a hostname.
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=edge
      - --entryPoints.web.address=:80
      - --api.dashboard=true
      - --log.level=INFO
    ports:
      - "80:80"
    volumes:
      # Read-only: the proxy only needs to *watch* for containers and their labels.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.localhost`)
      - traefik.http.routers.traefik.service=api@internal
    networks: [edge]

networks:
  edge:
    # Named, so every stack can join the same one by name.
    name: edge
